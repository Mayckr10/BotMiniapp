<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Loja</title>
<!-- Script oficial do Telegram: entrega o initData, o tema e os eventos do Mini App -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ── Tema ─────────────────────────────────────────────────────────────── */
:root{
  --bg: var(--tg-theme-bg-color, #0b0d12);
  --bg2: var(--tg-theme-secondary-bg-color, #141821);
  --card: color-mix(in srgb, var(--bg2) 85%, white 4%);
  --text: var(--tg-theme-text-color, #f4f5f8);
  --muted: var(--tg-theme-hint-color, #8b93a3);
  --line: color-mix(in srgb, var(--text) 9%, transparent);
  --a1: #ff2e7e; --a2: #ff7a3d;                 /* gradiente da marca */
  --accent: var(--a1);
  --grad: linear-gradient(135deg, var(--a1), var(--a2));
  --ok: #2fd27a; --warn: #ffb648; --err: #ff5d5d;
  --r: 20px; --rs: 14px;
  --sombra: 0 10px 30px rgba(0,0,0,.25);
  --nav-h: 64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;overscroll-behavior-y:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
img{display:block}
main{max-width:560px;margin:0 auto;padding:0 0 calc(var(--nav-h) + 24px + env(safe-area-inset-bottom))}
.pad{padding:0 16px}
h2{margin:0;font-size:19px;letter-spacing:-.01em}
.muted{color:var(--muted)}
.ocultar{display:none !important}

/* ── Topo / perfil ─────────────────────────────────────────────────────── */
.capa{position:relative;height:150px;overflow:hidden;background:var(--grad)}
.capa img{width:100%;height:100%;object-fit:cover;filter:blur(18px) saturate(1.4) brightness(.75);transform:scale(1.25)}
.capa::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,var(--bg) 100%)}
.capa .bolha{position:absolute;border-radius:50%;filter:blur(30px);opacity:.75;animation:flutua 9s ease-in-out infinite alternate}
.capa .b1{width:220px;height:220px;left:-60px;top:-80px;background:#ff2e7e}
.capa .b2{width:200px;height:200px;right:-40px;top:-50px;background:#ff7a3d;animation-delay:-4s}
.capa .b3{width:160px;height:160px;left:40%;top:40px;background:#7b5cff;animation-delay:-7s}
@keyframes flutua{to{transform:translate(18px,14px) scale(1.08)}}
.perfil{position:relative;padding:0 16px;margin-top:-46px;display:flex;flex-direction:column;align-items:center;text-align:center}
.avatar{width:96px;height:96px;border-radius:50%;object-fit:cover;background:var(--grad);display:grid;place-items:center;font-size:40px;color:#fff;border:4px solid var(--bg);box-shadow:var(--sombra)}
.nome{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:22px;font-weight:800;letter-spacing:-.02em}
.verif{width:20px;height:20px;border-radius:50%;background:var(--grad);display:inline-grid;place-items:center;color:#fff;font-size:12px;font-weight:900}
.bio{color:var(--muted);font-size:14px;margin:4px 0 0;max-width:420px}
.stats{display:flex;gap:28px;margin:14px 0 4px}
.stats div{text-align:center}
.stats b{display:block;font-size:17px;letter-spacing:-.01em}
.stats small{color:var(--muted);font-size:12px}
.cta-vip{margin:14px 16px 0;position:relative;overflow:hidden;border-radius:var(--r);padding:16px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 14px 34px color-mix(in srgb,var(--a1) 35%,transparent);cursor:pointer}
.cta-vip::before{content:"";position:absolute;inset:-40%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.35),transparent 45%);pointer-events:none}
.cta-vip b{display:block;font-size:16px}
.cta-vip small{opacity:.9;font-size:13px}
.cta-vip .seta{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:18px;flex:none}
.vip-ativo{margin:14px 16px 0;border-radius:var(--r);padding:14px 16px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;gap:12px}
.vip-ativo .ico{width:40px;height:40px;border-radius:12px;background:var(--grad);display:grid;place-items:center;color:#fff;font-size:18px;flex:none}
.vip-ativo b{display:block}
.vip-ativo small{color:var(--muted)}
.barra-prog{height:5px;border-radius:5px;background:var(--line);margin-top:8px;overflow:hidden}
.barra-prog i{display:block;height:100%;background:var(--grad);border-radius:5px}

/* ── Filtros / seções ──────────────────────────────────────────────────── */
.secao-titulo{display:flex;align-items:center;justify-content:space-between;padding:22px 16px 10px}
.secao-titulo h2{font-size:17px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted);transition:.2s}
.chip.on{background:var(--text);color:var(--bg);border-color:transparent}
.alt-vista{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
.alt-vista button{width:30px;height:26px;border-radius:7px;color:var(--muted);font-size:14px}
.alt-vista button.on{background:var(--bg);color:var(--text)}

/* ── Feed (posts estilo Privacy) ───────────────────────────────────────── */
.feed{display:flex;flex-direction:column;gap:14px;padding:0 16px}
.post{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sombra)}
.post .cab{display:flex;align-items:center;gap:10px;padding:12px 14px}
.post .cab .mini-av{width:34px;height:34px;border-radius:50%;background:var(--grad);display:grid;place-items:center;color:#fff;font-size:15px;object-fit:cover}
.post .cab b{display:block;font-size:14px}
.post .cab small{color:var(--muted);font-size:12px}
.midia{position:relative;aspect-ratio:4/5;background:#1a1f2a;overflow:hidden;cursor:pointer}
.midia img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.post:active .midia img{transform:scale(1.03)}
.midia .veu{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.45));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff}
.cadeado{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.14);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.3);display:grid;place-items:center;font-size:26px}
.desbloq{background:#fff;color:#111;border-radius:999px;padding:10px 18px;font-weight:800;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.comprado-selo{position:absolute;top:12px;left:12px;background:var(--ok);color:#042;font-weight:800;font-size:12px;padding:5px 10px;border-radius:999px}
.tag-combo{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);color:#fff;font-weight:700;font-size:12px;padding:5px 10px;border-radius:999px}
.midia .contagem{position:absolute;bottom:12px;left:12px;display:flex;gap:6px}
.pill{background:rgba(0,0,0,.55);backdrop-filter:blur(8px);color:#fff;font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px}
.post .rodape{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px}
.post .rodape b{font-size:15px}
.post .rodape small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.preco-tag{background:var(--grad);color:#fff;font-weight:800;padding:8px 14px;border-radius:999px;font-size:14px;white-space:nowrap}
.preco-tag.ok{background:var(--card);color:var(--ok);border:1px solid var(--line)}

/* grade compacta */
.grade{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:0 16px}
.grade .card{position:relative;border-radius:var(--rs);overflow:hidden;background:var(--card);cursor:pointer}
.grade .card img{width:100%;aspect-ratio:3/4;object-fit:cover}
.grade .card .veu{position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.7));display:flex;flex-direction:column;justify-content:flex-end;padding:10px;color:#fff}
.grade .card .veu b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grade .card .veu small{font-size:12px;opacity:.9}
.grade .card .cad{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.18);backdrop-filter:blur(8px);display:grid;place-items:center;font-size:14px}

/* ── VIP ───────────────────────────────────────────────────────────────── */
.hero-vip{margin:16px;border-radius:var(--r);padding:22px 18px;background:var(--grad);color:#fff;position:relative;overflow:hidden}
.hero-vip::after{content:"⭐";position:absolute;right:-10px;bottom:-24px;font-size:120px;opacity:.15;transform:rotate(-15deg)}
.hero-vip h2{font-size:24px;color:#fff}
.hero-vip p{margin:6px 0 0;opacity:.92;font-size:14px}
.beneficios{margin:0 16px 14px;display:grid;gap:8px}
.beneficio{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--rs);padding:12px 14px;font-size:14px}
.beneficio .ico{width:36px;height:36px;border-radius:11px;background:color-mix(in srgb,var(--a1) 14%,transparent);display:grid;place-items:center;font-size:17px;flex:none}
.planos{padding:0 16px;display:grid;gap:10px}
.plano{position:relative;display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;transition:.2s}
.plano.on{border-color:var(--a1);background:color-mix(in srgb,var(--a1) 8%,var(--card));box-shadow:0 0 0 4px color-mix(in srgb,var(--a1) 14%,transparent)}
.plano .radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;flex:none}
.plano.on .radio{border-color:var(--a1);background:var(--a1)}
.plano.on .radio::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.plano .txt{flex:1}
.plano b{font-size:16px}
.plano small{display:block;color:var(--muted);font-size:12.5px}
.plano .valor{text-align:right}
.plano .valor b{font-size:17px}
.plano .valor small{font-size:11.5px}
.eco{display:inline-block;background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok);font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;margin-left:6px;vertical-align:middle}
.popular{position:absolute;top:-10px;right:14px;background:var(--grad);color:#fff;font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px;letter-spacing:.02em}
.fixo-cta{position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 10px);padding:12px 16px 0;z-index:4}

/* ── Minhas / Mimos ────────────────────────────────────────────────────── */
.lista{padding:0 16px;display:grid;gap:10px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--rs);padding:10px 12px}
.item img,.item .thumb{width:54px;height:54px;border-radius:12px;object-fit:cover;background:var(--grad);display:grid;place-items:center;font-size:22px;color:#fff;flex:none}
.item .txt{flex:1;min-width:0}
.item b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14.5px}
.item small{color:var(--muted);font-size:12.5px}
.mimos{padding:0 16px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.mimo{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:18px 14px;text-align:left;transition:.2s}
.mimo:active{transform:scale(.97)}
.mimo .emoji{font-size:28px}
.mimo b{display:block;font-size:19px;margin-top:6px;letter-spacing:-.01em}
.mimo small{color:var(--muted);font-size:12px}
.campo{display:flex;gap:8px;padding:12px 16px 0}
.campo input{flex:1}
input[type=text]{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;color:var(--text);font-size:15px;outline:none;transition:.2s}
input:focus{border-color:var(--a1)}
input::placeholder{color:var(--muted)}

/* ── Botões ────────────────────────────────────────────────────────────── */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border-radius:16px;padding:15px;background:var(--grad);color:#fff;font-weight:800;font-size:15.5px;box-shadow:0 10px 26px color-mix(in srgb,var(--a1) 30%,transparent);transition:.15s}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.55;box-shadow:none}
.btn.sec{background:var(--card);color:var(--text);box-shadow:none;border:1px solid var(--line)}
.btn.fantasma{background:transparent;color:var(--muted);box-shadow:none;padding:10px}
.btn.mini{width:auto;padding:9px 14px;font-size:13px;border-radius:12px}
.vazio{text-align:center;padding:48px 24px;color:var(--muted)}
.vazio .ico{font-size:44px;margin-bottom:8px}

/* ── Barra inferior ────────────────────────────────────────────────────── */
.barra{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;padding:0 12px calc(10px + env(safe-area-inset-bottom))}
.barra nav{display:flex;width:100%;max-width:536px;height:var(--nav-h);background:color-mix(in srgb,var(--bg2) 78%,transparent);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 40px rgba(0,0,0,.35);padding:6px}
.barra nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:16px;color:var(--muted);font-size:11px;font-weight:600;transition:.2s}
.barra nav button .ico{font-size:20px;line-height:1;transition:transform .2s}
.barra nav button.on{color:var(--text);background:color-mix(in srgb,var(--text) 7%,transparent)}
.barra nav button.on .ico{transform:translateY(-1px) scale(1.08)}
.barra nav button .dot{position:absolute}

/* ── Folha (bottom sheet) ──────────────────────────────────────────────── */
.fundo{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:30;display:flex;align-items:flex-end;justify-content:center;animation:surge .2s}
@keyframes surge{from{opacity:0}}
.folha{position:relative;background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:26px 26px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));animation:sobe .32s cubic-bezier(.2,.8,.2,1)}
@keyframes sobe{from{transform:translateY(60px);opacity:.4}}
.alca{width:42px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 14px}
.fechar{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;background:var(--card);color:var(--muted);font-size:16px;display:grid;place-items:center}
.previa-wrap{position:relative;border-radius:var(--r);overflow:hidden;margin-bottom:14px;max-height:48vh}
.previa-wrap img{width:100%;max-height:48vh;object-fit:cover}
.previa-wrap .veu{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.25)}
.midia-chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.midia-chips span{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12.5px;color:var(--muted)}
.linha-preco{display:flex;justify-content:space-between;align-items:baseline;margin:10px 0 14px}
.linha-preco s{color:var(--muted);margin-right:8px;font-size:15px}
.linha-preco .v{font-size:26px;font-weight:900;letter-spacing:-.02em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.cupom-toggle{font-size:13.5px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:4px 0 12px;display:inline-block}
.cupom-wrap{display:none;margin-bottom:12px}
.cupom-wrap.on{display:block}
.gap{height:10px}
.sub{color:var(--muted);font-size:14px;margin:4px 0 12px}
.aviso{font-size:13px;color:var(--warn);margin:-4px 0 10px}
.aviso.ok{color:var(--ok)}
/* PIX */
.valor-pix{text-align:center;margin:4px 0 14px}
.valor-pix .v{font-size:34px;font-weight:900;letter-spacing:-.03em}
.valor-pix small{color:var(--muted)}
.qr-card{background:#fff;border-radius:22px;padding:14px;width:min(250px,70vw);margin:0 auto 14px;box-shadow:var(--sombra)}
.qr-card img{width:100%}
.codigo{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.codigo code{flex:1;font:12px ui-monospace,Menlo,Consolas,monospace;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{display:flex;align-items:center;gap:8px;justify-content:center;color:var(--muted);font-size:13.5px;margin:12px 0}
.pulso{width:9px;height:9px;border-radius:50%;background:var(--warn);animation:p 1.2s infinite}
@keyframes p{50%{opacity:.25;transform:scale(.8)}}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--text)}
.passos{display:grid;gap:6px;margin:4px 0 14px;font-size:13px;color:var(--muted)}
.passos div{display:flex;gap:8px}
.passos i{font-style:normal;width:20px;height:20px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:11px;color:var(--text);flex:none}
/* sucesso */
.ok-grande{text-align:center;padding:18px 8px 8px}
.check{width:92px;height:92px;border-radius:50%;background:var(--grad);margin:0 auto 14px;display:grid;place-items:center;color:#fff;font-size:44px;animation:pop .5s cubic-bezier(.2,1.4,.4,1);box-shadow:0 16px 40px color-mix(in srgb,var(--a1) 40%,transparent)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.ok-grande .emoji{font-size:60px;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 28px);transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;z-index:40;font-size:13.5px;font-weight:600;box-shadow:var(--sombra);animation:sobe .25s}

/* ── Skeleton ──────────────────────────────────────────────────────────── */
.sk{background:linear-gradient(90deg,var(--card) 25%,color-mix(in srgb,var(--card) 70%,white 6%) 50%,var(--card) 75%);background-size:200% 100%;animation:sk 1.3s infinite;border-radius:14px}
@keyframes sk{to{background-position:-200% 0}}
.preco-tag.ok{cursor:pointer}
.item{cursor:pointer}

/* ── Posts de texto e legendas ───────────────────────────────────────── */
.legenda{padding:0 14px 12px;font-size:14.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.legenda.mais{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.post-texto .corpo{padding:0 14px 14px;font-size:15.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.post-texto img.foto-post{width:100%;max-height:560px;object-fit:cover}
.post .cab{position:relative}
.menu-post{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;color:var(--muted);font-size:18px;display:grid;place-items:center}
.menu-post:active{background:var(--line)}
/* ── Modo criadora ─────────────────────────────────────────────────────── */
.selo-criadora{display:inline-flex;align-items:center;gap:6px;margin-top:10px;background:color-mix(in srgb,var(--a1) 14%,transparent);color:var(--a1);font-size:12px;font-weight:800;padding:5px 11px;border-radius:999px}
.avatar-wrap{position:relative;cursor:pointer}
.avatar-wrap .lapis{position:absolute;right:0;bottom:2px;width:30px;height:30px;border-radius:50%;background:var(--text);color:var(--bg);display:grid;place-items:center;font-size:14px;border:3px solid var(--bg)}
.fab{position:fixed;right:18px;bottom:calc(var(--nav-h) + 26px + env(safe-area-inset-bottom));z-index:11;width:58px;height:58px;border-radius:20px;background:var(--grad);color:#fff;font-size:30px;font-weight:300;display:grid;place-items:center;box-shadow:0 14px 34px color-mix(in srgb,var(--a1) 45%,transparent)}
.fab:active{transform:scale(.94)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi small{color:var(--muted);font-size:12px;font-weight:600}
.kpi b{display:block;font-size:21px;letter-spacing:-.02em;margin-top:2px}
.kpi span{color:var(--muted);font-size:12.5px}
.kpi.destaque{background:var(--grad);color:#fff;border:0}
.kpi.destaque small,.kpi.destaque span{color:rgba(255,255,255,.85)}
.acoes{display:grid;gap:10px;padding:0 16px}
.acao{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;width:100%}
.acao .ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:21px;flex:none;background:color-mix(in srgb,var(--a1) 13%,transparent)}
.acao b{display:block;font-size:15px}
.acao small{color:var(--muted);font-size:12.5px}
.acao .seta{margin-left:auto;color:var(--muted);font-size:20px}
.troca{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:0 16px}
.chave{position:relative;width:50px;height:30px;border-radius:999px;background:var(--line);transition:.2s;flex:none}
.chave::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.chave.on{background:var(--ok)}
.chave.on::after{transform:translateX(20px)}
.rotulo{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:14px 0 6px}
textarea{width:100%;min-height:110px;resize:vertical;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--text);font:15px/1.5 inherit;font-family:inherit;outline:none}
textarea:focus{border-color:var(--a1)}
.escolher{display:flex;align-items:center;justify-content:center;gap:8px;border:2px dashed var(--line);border-radius:var(--r);padding:20px;color:var(--muted);font-weight:700;cursor:pointer;width:100%;background:transparent}
.interacoes{display:flex;align-items:center;gap:6px;padding:0 10px 12px;margin-top:-4px}
.interacao{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;font-size:14px;font-weight:700;color:var(--text);background:transparent}
.interacao:active{background:var(--line)}
.interacao.on{color:var(--a1)}
.interacao .coracao{font-size:18px;line-height:1;display:inline-block}
.interacao.pop .coracao{animation:pop .35s ease}
.interacao.info{color:var(--muted);font-size:13px;font-weight:600;margin-left:auto}
@keyframes pop{40%{transform:scale(1.45)}100%{transform:scale(1)}}
.seg{display:flex;gap:4px;margin:0 16px 10px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.seg button{flex:1;height:34px;border-radius:10px;font-weight:700;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--text);color:var(--bg)}
.kpis.tres{grid-template-columns:repeat(3,1fr)}
.kpis.tres .kpi b{font-size:17px}
.grafico{margin:0 16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 14px 10px}
.grafico .barras{display:flex;align-items:flex-end;gap:5px;height:120px}
.grafico .col{flex:1;border-radius:6px 6px 3px 3px;background:color-mix(in srgb,var(--a1) 22%,transparent);min-height:3px;position:relative}
.grafico .col.hoje{background:var(--grad)}
.grafico .eixo{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:8px}
.grafico .topo{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.grafico .topo b{font-size:20px;letter-spacing:-.02em}
.divisao{display:flex;height:10px;border-radius:999px;overflow:hidden;margin:12px 0 10px;background:var(--line)}
.legendas{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.legendas i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.ranking{margin:0 16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ranking .linha{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line)}
.ranking .linha:first-child{border-top:0}
.ranking .pos{width:22px;font-weight:800;color:var(--muted);text-align:center}
.ranking img{width:42px;height:42px;border-radius:10px;object-fit:cover}
.ranking .txt{flex:1;min-width:0}
.ranking .txt b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ranking .txt small{color:var(--muted);font-size:12px}
.ranking .v{font-weight:800;font-size:14px}
.miniaturas{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.miniaturas div{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--card)}
.miniaturas img,.miniaturas video{width:100%;height:100%;object-fit:cover}
.miniaturas .x{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:12px;display:grid;place-items:center}
.miniaturas .v{position:absolute;bottom:4px;left:4px;background:rgba(0,0,0,.6);color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:999px}
.progresso{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin:14px 0 6px}
.progresso i{display:block;height:100%;width:0;background:var(--grad);transition:width .2s}
.dica{font-size:12.5px;color:var(--muted);margin-top:6px}
.dica code{background:var(--card);border:1px solid var(--line);padding:1px 6px;border-radius:6px;font-size:12px}
.balao{background:var(--card);border:1px solid var(--line);border-radius:18px 18px 18px 6px;overflow:hidden;max-width:88%;margin-top:6px}
.balao img{width:100%;max-height:220px;object-fit:cover}
.balao p{margin:0;padding:10px 12px;white-space:pre-wrap;font-size:14px}
.perigo{color:var(--err) !important}
.lista-msg .acao .ico{background:color-mix(in srgb,#7b5cff 16%,transparent)}
.foto-perfil-ed{width:110px;height:110px;border-radius:50%;object-fit:cover;margin:4px auto 8px;display:grid;place-items:center;background:var(--grad);font-size:44px;color:#fff;cursor:pointer}

/* ── Galeria (carrossel do conteúdo comprado) ─────────────────────────── */
.galeria{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column;animation:surge .2s;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.galeria header{position:absolute;top:0;left:0;right:0;z-index:2;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 24px;background:linear-gradient(180deg,rgba(0,0,0,.7),transparent);color:#fff}
.galeria header .av{width:34px;height:34px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-size:15px;flex:none;object-fit:cover}
.galeria header .t{flex:1;min-width:0}
.galeria header b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.galeria header small{opacity:.75;font-size:12px}
.galeria header button{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:16px;display:grid;place-items:center}
.trilho{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.trilho::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;height:100%;scroll-snap-align:center;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;position:relative}
.slide img,.slide video{max-width:100%;max-height:100%;object-fit:contain;-webkit-user-drag:none;pointer-events:auto}
.slide img{pointer-events:none}
.slide .carregando{position:absolute;inset:0;display:grid;place-items:center}
.slide .carregando i{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.18);border-top-color:#fff;animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.slide .grande{color:#fff;text-align:center;padding:24px;display:grid;gap:12px;justify-items:center}
.slide .grande .ico{font-size:46px}
.galeria footer{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:22px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(0deg,rgba(0,0,0,.7),transparent);display:flex;flex-direction:column;align-items:center;gap:10px}
.pontos{display:flex;gap:6px;max-width:100%;overflow:hidden}
.pontos i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.35);transition:.2s;flex:none}
.pontos i.on{background:#fff;width:18px;border-radius:4px}
.contador{position:absolute;top:calc(64px + env(safe-area-inset-top));right:14px;z-index:2;background:rgba(0,0,0,.55);color:#fff;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px}
.seta-g{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font-size:22px;display:none;place-items:center}
@media (hover:hover){.seta-g{display:grid}}
.seta-g.esq{left:12px}.seta-g.dir{right:12px}
.galeria .rodape-g{display:flex;gap:8px}
.galeria .rodape-g .btn{width:auto;padding:10px 16px;font-size:13.5px}
</style>

<body>
<main id="app">
  <div class="capa"><span class="bolha b1"></span><span class="bolha b2"></span><span class="bolha b3"></span></div>
  <div class="perfil"><div class="sk" style="width:96px;height:96px;border-radius:50%;border:4px solid var(--bg)"></div>
    <div class="sk" style="width:160px;height:22px;margin-top:12px"></div><div class="sk" style="width:220px;height:14px;margin-top:8px"></div></div>
  <div class="feed" style="margin-top:22px"><div class="sk" style="height:380px"></div><div class="sk" style="height:380px"></div></div>
</main>
<div class="barra" id="barra"></div>

<script>
const tg = window.Telegram?.WebApp;
// initData assinado pelo Telegram (o simulador passa no #tgWebAppData, igual ao Telegram de verdade)
const INIT = tg?.initData || new URLSearchParams(location.hash.slice(1)).get("tgWebAppData") || "";
try{ tg?.ready(); tg?.expand(); tg?.setHeaderColor?.("bg_color"); tg?.setBackgroundColor?.("bg_color") }catch(e){}

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const criadora = () => D && D.sou_criadora && !COMO_FA;
const avatarSrc = () => `/api/loja/foto?v=${encodeURIComponent(D.criadora.foto_v || "")}`;
const reais = c => "R$ " + (c/100).toFixed(2).replace(".", ",");
const EMOJI_MIMO = ["☕","🌹","💎","👑","🚀","🔥"];
let PERIODO = "7d";
let COMO_FA = false, PAINEL = null, ULTIMO = null, D = null, ABA = "inicio", FILTRO = "todos", VISTA = "feed", PLANO_SEL = null, POLL = null, TIMER = null;

async function api(caminho, corpo){
  const r = await fetch(caminho, {
    method: corpo ? "POST" : "GET",
    headers: {"X-Telegram-Init-Data": INIT, ...(corpo ? {"Content-Type": "application/json"} : {})},
    body: corpo ? JSON.stringify(corpo) : undefined,
  });
  const j = await r.json().catch(() => ({}));
  return {ok: r.ok, status: r.status, ...j};
}
function enviarForm(caminho, campos, arquivos = [], aoProgresso){
  return new Promise(res => {
    const fd = new FormData();
    Object.entries(campos).forEach(([k, v]) => fd.append(k, v ?? ""));
    arquivos.forEach(([nome, f]) => fd.append(nome, f, f.name || "arquivo"));
    const x = new XMLHttpRequest();
    x.open("POST", caminho);
    x.setRequestHeader("X-Telegram-Init-Data", INIT);
    x.upload.onprogress = e => e.lengthComputable && aoProgresso?.(e.loaded / e.total);
    x.onload = () => { let j = {}; try{ j = JSON.parse(x.responseText) }catch(e){} res({ok: x.status < 300, status: x.status, ...j}) };
    x.onerror = () => res({ok:false, erro:"Sem conexão. Tente de novo."});
    x.send(fd);
  });
}
function toast(t){ const d=document.createElement("div"); d.className="toast"; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2600) }
function vibrar(tipo){ try{ tipo === "leve" ? tg?.HapticFeedback?.impactOccurred("light") : tg?.HapticFeedback?.notificationOccurred(tipo) }catch(e){} }
function relativo(iso){
  if(!iso) return "";
  const d = (Date.now() - new Date(iso).getTime()) / 864e5;
  if(d < 1) return "hoje"; if(d < 2) return "ontem"; if(d < 30) return `há ${Math.floor(d)} dias`;
  if(d < 365) return `há ${Math.floor(d/30)} ${d < 60 ? "mês" : "meses"}`; return `há ${Math.floor(d/365)} ano(s)`;
}
function midias(x){
  const p = []; if(x.fotos) p.push(`📷 ${x.fotos}`); if(x.videos) p.push(`🎬 ${x.videos}`); return p;
}

async function carregar(){
  const r = await api("/api/loja/dados");
  if(!r.ok){ $("#app").innerHTML = `<div class="vazio"><div class="ico">🔒</div>Abra a loja pelo botão do bot no Telegram.</div>`; return }
  const primeira = !D;
  D = r;
  if(primeira && D.sou_criadora) return escolherModo();
  if(!PLANO_SEL) PLANO_SEL = (D.planos.find(p => p.economia) || D.planos[0])?.id;
  render();
}

/* ── Render ────────────────────────────────────────────────────────────── */
function render(){
  const c = D.criadora, t = c.totais || {};
  const mensal = D.planos.find(p => p.dias === 30) || D.planos[0];
  $("#app").innerHTML = `
    <header>
      <div class="capa">${c.tem_foto ? `<img src="${avatarSrc()}" alt="">` : `<span class="bolha b1"></span><span class="bolha b2"></span><span class="bolha b3"></span>`}</div>
      <div class="perfil">
        <div class="${criadora() ? "avatar-wrap" : ""}" ${criadora() ? 'id="ed-perfil"' : ""}>
          ${c.tem_foto ? `<img class="avatar" src="${avatarSrc()}" alt="">` : `<div class="avatar">✨</div>`}
          ${criadora() ? `<span class="lapis">✎</span>` : ""}
        </div>
        <div class="nome">${esc(c.nome)} <span class="verif" title="Perfil oficial">✓</span></div>
        <p class="bio">${esc(c.bio)}</p>
        ${criadora() ? `<span class="selo-criadora">👑 Modo criadora</span>` : ""}
        <div class="stats">
          <div><b>${t.conteudos ?? D.packs.length}</b><small>conteúdos</small></div>
          <div><b>${t.fotos ?? 0}</b><small>fotos</small></div>
          <div><b>${t.videos ?? 0}</b><small>vídeos</small></div>
        </div>
      </div>
      ${criadora() ? "" : D.assinatura ? vipAtivo() : mensal && ABA !== "vip" ? `
      <div class="cta-vip" data-aba="vip">
        <div><b>Assinar VIP</b><small>Canal privado exclusivo · a partir de ${esc(mensal.preco_fmt)}/mês</small></div>
        <span class="seta">›</span>
      </div>` : ""}
    </header>
    <section id="conteudo">${aba()}</section>`;
  $("#barra").innerHTML = `<nav>
    ${(criadora() ? [["inicio","🏠","Início"],["painel","📊","Painel"],["vip","⭐","VIP"],["gorjeta","💝","Mimos"]]
                  : [["inicio","🏠","Início"],["vip","⭐","VIP"],["minhas","🗂️","Minhas"],["gorjeta","💝","Mimos"]])
      .map(([id,i,t]) => `<button data-aba="${id}" class="${ABA===id?"on":""}"><span class="ico">${i}</span>${t}</button>`).join("")}
  </nav>`;
  $("#fab")?.remove();
  if(criadora() && ABA === "inicio"){ const f = document.createElement("button"); f.className = "fab"; f.id = "fab"; f.textContent = "+"; f.onclick = escolherCriacao; document.body.appendChild(f) }
  if(criadora() && ABA === "painel" && !PAINEL) carregarPainel();
  $("#volta-criadora")?.remove();
  if(D.sou_criadora && COMO_FA){
    const v = document.createElement("button"); v.id = "volta-criadora"; v.className = "selo-criadora";
    v.style.cssText = "position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:12;margin:0;box-shadow:var(--sombra);background:var(--bg)";
    v.textContent = "👑 Entrar como criadora"; v.onclick = () => { COMO_FA = false; ABA = "painel"; render() };
    document.body.appendChild(v);
  }
}

function vipAtivo(){
  const a = D.assinatura;
  return `<div class="vip-ativo" data-aba="vip">
    <div class="ico">⭐</div>
    <div style="flex:1"><b>Você é VIP</b><small>Acesso até ${esc(a.ate)}</small></div>
    <span class="muted" style="font-size:18px">›</span>
  </div>`;
}

function aba(){
  if(ABA === "inicio") return inicio();
  if(ABA === "painel") return painel();
  if(ABA === "vip") return vip();
  if(ABA === "minhas") return minhas();
  return mimos();
}

function cabPost(menu){
  return `<div class="cab">${D.criadora.tem_foto ? `<img class="mini-av" src="${avatarSrc()}" alt="">` : `<div class="mini-av">✨</div>`}
    <div><b>${esc(D.criadora.nome)}</b><small>${menu.data}</small></div>
    ${criadora() && menu.acao ? `<button class="menu-post" data-menu="${menu.acao}">⋯</button>` : ""}</div>`;
}
function interacoes(alvo){
  const c = (D.curtidas || {})[alvo] || {n:0, eu:false};
  const m = (D.mimos || {})[alvo];
  return `<div class="interacoes">
    <button class="interacao ${c.eu ? "on" : ""}" data-curtir="${alvo}"><span class="coracao">${c.eu ? "❤️" : "🤍"}</span><span class="n">${c.n || ""}</span></button>
    ${criadora()
      ? `<span class="interacao info">💝 ${m ? `${m.qtd} mimo(s) · ${esc(m.total_fmt)}` : "nenhum mimo ainda"}</span>`
      : `<button class="interacao" data-mimo="${alvo}"><span class="coracao">💝</span><span>Mimo</span></button>`}
  </div>`;
}
function postTexto(p){
  return `<article class="post post-texto">
    ${cabPost({data: esc(relativo(p.criado_em)), acao: `post:${p.id}`})}
    ${p.texto ? `<div class="corpo">${esc(p.texto)}</div>` : ""}
    ${p.foto ? `<img class="foto-post" src="/api/loja/post_foto/${p.id}" loading="lazy" alt="">` : ""}
    <div style="height:8px"></div>${interacoes(`post_${p.id}`)}
  </article>`;
}
function inicio(){
  let itens = [...D.combos.map(x => ({...x, combo:true})), ...D.packs];
  if(FILTRO === "packs") itens = itens.filter(x => !x.combo);
  if(FILTRO === "combos") itens = itens.filter(x => x.combo);
  if(FILTRO === "posts") itens = [];
  const posts = FILTRO === "todos" || FILTRO === "posts" ? D.posts.map(p => ({...p, texto_post:true})) : [];
  if(criadora()) itens = itens.map(x => ({...x, comprado: true}));
  const cab = `
    <div class="secao-titulo"><h2>Conteúdos</h2>
      <div class="alt-vista"><button data-vista="feed" class="${VISTA==="feed"?"on":""}">☰</button><button data-vista="grade" class="${VISTA==="grade"?"on":""}">▦</button></div></div>
    <div class="chips">${[["todos","Todos"],["posts","📝 Posts"],["packs","📦 Packs"],["combos","🎁 Combos"]]
      .map(([id,t]) => `<button class="chip ${FILTRO===id?"on":""}" data-filtro="${id}">${t}</button>`).join("")}</div>`;
  if(!itens.length && !posts.length) return cab + (criadora()
    ? `<div class="vazio"><div class="ico">✨</div>Seu feed está vazio.<br>Toque no <b>+</b> para publicar o primeiro post ou pack.</div>`
    : `<div class="vazio"><div class="ico">🫧</div>Nada por aqui ainda.<br>Dá uma olhada no VIP ⭐</div>`);
  if(VISTA === "grade") return cab + `<div class="grade">${itens.map(x => `
    <div class="card" data-item="${x.id}">
      <img src="/api/loja/previa/${x.id}" loading="lazy" alt="">
      <span class="cad">${x.comprado ? "✅" : "🔒"}</span>
      <div class="veu"><b>${esc(x.titulo)}</b><small>${x.comprado ? "Comprado" : esc(x.preco_fmt)}</small></div>
    </div>`).join("")}</div>`;
  const todos = [...posts, ...itens].sort((a, b) => (b.combo ? 1 : 0) - (a.combo ? 1 : 0) || String(b.criado_em || "").localeCompare(String(a.criado_em || "")));
  return cab + `<div class="feed">${todos.map(x => x.texto_post ? postTexto(x) : `
    <article class="post">
      ${cabPost({data: x.combo ? "Combo especial" : esc(relativo(x.criado_em)) || "Pack", acao: x.combo ? "" : `pack:${x.id}`})}
      ${x.legenda ? `<div class="legenda ${x.legenda.length > 220 ? "mais" : ""}">${esc(x.legenda)}</div>` : ""}
      <div class="midia card" data-item="${x.id}">
        <img src="/api/loja/previa/${x.id}" loading="lazy" alt="">
        ${criadora() ? `<span class="comprado-selo">${esc(x.preco_fmt)}</span>` : x.comprado ? `<span class="comprado-selo">✓ Comprado</span>` : ""}
        ${x.combo ? `<span class="tag-combo">🎁 ${x.packs.length} packs</span>` : ""}
        <div class="veu">

/* ── Folha (bottom sheet) ──────────────────────────────────────────────── */
function abrirFolha(html){
  fecharFolha();
  const f = document.createElement("div"); f.className = "fundo"; f.id = "fundo";
  f.innerHTML = `<div class="folha"><div class="alca"></div><button class="fechar" id="fechar">✕</button>${html}</div>`;
  f.addEventListener("click", e => { if(e.target === f || e.target.id === "fechar") fecharFolha() });
  document.body.appendChild(f);
  try{ tg?.BackButton?.show(); tg?.BackButton?.onClick(fecharFolha) }catch(e){}
}
function fecharFolha(){ clearInterval(POLL); clearInterval(TIMER); POLL = TIMER = null; $("#fundo")?.remove(); try{ tg?.BackButton?.hide() }catch(e){} }

function detalhes(id){
  const p = D.packs.find(x => x.id === id) || D.combos.find(x => x.id === id);
  const plano = D.planos.find(x => x.id === id);
  if(p && (p.comprado || criadora())){ return abrirGaleria(id) }
  const titulo = p ? p.titulo : plano ? `VIP ${plano.nome}` : "Mimo";
  const preco = p ? p.preco_fmt : plano ? plano.preco_fmt : "";
  abrirFolha(`
    ${p ? `<div class="previa-wrap"><img src="/api/loja/previa/${id}" alt=""><div class="veu"><span class="cadeado">🔒</span></div></div>` : `<div class="ok-grande"><div class="emoji">⭐</div></div>`}
    <h2>${esc(titulo)}</h2>
    ${p ? `<div class="midia-chips">${midias(p).map(m => `<span>${m}</span>`).join("")}<span>🔓 sem desfoque após o pagamento</span><span>🛡️ conteúdo protegido</span></div>` : ""}
    ${plano ? `<p class="sub">${plano.dias} dias de acesso ao canal VIP e ao chat.</p>` : ""}
    ${p && p.packs ? `<p class="sub">Inclui: ${p.packs.map(esc).join(" · ")}<br>Separados: <s>${esc(p.separados_fmt)}</s></p>` : ""}
    <div class="linha-preco"><span class="muted">Total</span><span class="v">${esc(preco)}</span></div>
    <span class="cupom-toggle" id="cupom-toggle">Tenho um cupom</span>
    <div class="cupom-wrap" id="cupom-wrap"><input type="text" id="cupom" placeholder="Código do cupom" autocapitalize="characters"></div>
    <button class="btn" id="pagar" data-item="${id}">💠 Pagar com PIX</button>
    <p class="sub" style="text-align:center;margin:10px 0 0;font-size:12.5px">Aprovação na hora · entregue no seu chat com o bot</p>`);
  $("#cupom-toggle").onclick = () => { $("#cupom-wrap").classList.add("on"); $("#cupom-toggle").classList.add("ocultar"); $("#cupom").focus() };
}

async function pagar(id, cupom){
  if(D.idade === "menor"){ abrirFolha(`<div class="ok-grande"><div class="emoji">🔞</div><h2>Conteúdo para maiores de 18</h2><p class="sub">Não é possível comprar com esta conta.</p></div>`); return }
  if(D.idade !== "ok"){ return pedirIdade(() => pagar(id, cupom)) }
  const btn = $("#pagar") || $("#assinar"); if(btn){ btn.disabled = true; btn.textContent = "Gerando PIX…" }
  vibrar("leve");
  ULTIMO = id;
  const r = await api("/api/loja/comprar", {item_id: id, cupom});
  if(r.status === "ja_comprou"){ vibrar("success"); return sucesso("Você já tem este conteúdo. Enviei de novo no seu chat com o bot 💌") }
  if(!r.ok){ toast(r.status === "idade" ? "Confirme sua idade" : "Não consegui gerar o PIX. Tente de novo."); if(btn){btn.disabled=false; btn.textContent="💠 Pagar com PIX"} return }
  mostrarPix(r);
}

function pedirIdade(continuar){
  abrirFolha(`
    <div class="ok-grande"><div class="emoji">🔞</div><h2>Conteúdo para maiores de 18 anos</h2>
    <p class="sub">Para continuar, confirme que você tem 18 anos ou mais e que não vai compartilhar o conteúdo comprado.</p></div>
    <button class="btn" id="idade-sim">Tenho 18 anos ou mais</button><div class="gap"></div>
    <button class="btn sec" id="idade-nao">Sou menor de 18</button>`);
  $("#idade-sim").onclick = async () => { await api("/api/loja/idade", {maior:true}); D.idade = "ok"; continuar() };
  $("#idade-nao").onclick = async () => { await api("/api/loja/idade", {maior:false}); D.idade = "menor"; pagar() };
}

function mostrarPix(r){
  const ate = new Date(r.expira);
  abrirFolha(`
    <div class="valor-pix"><small>${esc(r.titulo)}</small><div class="v">${esc(r.valor_fmt)}</div>
      ${r.original_fmt ? `<small><s>${esc(r.original_fmt)}</s> · cupom aplicado</small>` : ""}</div>
    ${r.cupom ? `<div class="aviso ok" style="text-align:center">🏷️ ${esc(r.cupom.codigo)} (${esc(r.cupom.descricao)})</div>` : ""}
    ${r.cupom_erro ? `<div class="aviso" style="text-align:center">⚠️ ${esc(r.cupom_erro)}</div>` : ""}
    <div class="qr-card"><img src="${r.qr}" alt="QR Code PIX"></div>
    <div class="codigo"><code id="codigo">${esc(r.copia_e_cola)}</code><button class="btn mini" id="copiar">Copiar</button></div>
    <div class="passos">
      <div><i>1</i>Abra o app do seu banco e escolha PIX</div>
      <div><i>2</i>Leia o QR Code ou cole o código</div>
      <div><i>3</i>Pronto! O conteúdo chega no chat com o bot</div>
    </div>
    <div class="status"><span class="pulso"></span><span id="st">Aguardando pagamento · expira em <span class="timer" id="timer">--:--</span></span></div>
    <button class="btn sec" id="ja-paguei">Já paguei</button>
    ${D.teste ? `<div class="gap"></div><button class="btn fantasma" id="teste-pagar">🧪 Simular pagamento (teste)</button>` : ""}`);
  if(D.teste) $("#teste-pagar").onclick = async () => { await api("/api/loja/teste_pagar", {pix_id: r.pix_id}); verificar(r.pix_id, false) };
  $("#copiar").onclick = async () => {
    try{ await navigator.clipboard.writeText(r.copia_e_cola); vibrar("leve"); toast("Código PIX copiado ✓") }
    catch(e){ const s = getSelection(), rg = document.createRange(); rg.selectNodeContents($("#codigo")); s.removeAllRanges(); s.addRange(rg); toast("Selecione e copie o código") }
  };
  $("#ja-paguei").onclick = () => verificar(r.pix_id, true);
  const tick = () => { const s = Math.max(0, Math.floor((ate - Date.now())/1000)); const el = $("#timer"); if(el) el.textContent = `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`; if(!s) clearInterval(TIMER) };
  tick(); TIMER = setInterval(tick, 1000);
  POLL = setInterval(() => verificar(r.pix_id, false), 3000);
}

async function verificar(pix, manual){
  const r = await api(`/api/loja/pedido/${pix}${manual ? "?verificar=1" : ""}`);
  if(r.status === "PAGO"){ vibrar("success"); sucesso("Pagamento confirmado! O conteúdo já está no seu chat com o bot 💌"); carregar(); return }
  if(r.status === "EXPIRADO"){ clearInterval(POLL); clearInterval(TIMER); $("#st").textContent = "PIX expirado. Feche e gere um novo."; return }
  if(manual) toast("Ainda não identificamos o pagamento. Aguarde alguns segundos.");
}

function sucesso(texto){
  const ver = /^(pack|combo)_/.test(ULTIMO || "");
  abrirFolha(`<div class="ok-grande"><div class="check">✓</div><h2>Tudo certo!</h2><p class="sub">${esc(texto)}</p></div>
    ${ver ? `<button class="btn" id="ver-agora">▶ Ver agora</button><div class="gap"></div>` : ""}
    <button class="btn ${ver ? "sec" : ""}" id="voltar-chat">Ir para o chat</button><div class="gap"></div>
    <button class="btn sec" id="continuar">Continuar na loja</button>`);
  $("#voltar-chat").onclick = () => tg ? tg.close() : fecharFolha();
  $("#continuar").onclick = fecharFolha;
  if(ver) $("#ver-agora").onclick = () => { const id = ULTIMO; fecharFolha(); abrirGaleria(id) };
}

async function reenviar(packId){

}

      <div class="barras">${S.grafico.map((g, i) => `<div class="col ${i === S.grafico.length - 1 ? "hoje" : ""}" style="height:${Math.max(2, Math.round(g.v / max * 100))}%" title="${g.dia}: ${reais(g.v)}"></div>`).join("")}</div>

async function curtir(el){
  const alvo = el.dataset.curtir;
  const c = D.curtidas[alvo] = D.curtidas[alvo] || {n:0, eu:false};
  c.eu = !c.eu; c.n += c.eu ? 1 : -1;
  const pintar = () => { el.classList.toggle("on", c.eu); el.querySelector(".coracao").textContent = c.eu ? "❤️" : "🤍"; el.querySelector(".n").textContent = c.n || "" };
  pintar(); vibrar("leve");
  if(c.eu){ el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop") }
  const r = await api("/api/loja/curtir", {alvo});
  if(r.ok){ c.eu = r.curtido; c.n = r.total; pintar() }
}

    <div class="acoes" style="padding:0">
      <button class="acao" data-criar="post"><span class="ico">📝</span><div><b>Publicação</b><small>Texto com foto opcional, grátis no feed</small></div><span class="seta">›</span></button>
      <button class="acao" data-criar="pack"><span class="ico">📦</span><div><b>Pack pago</b><small>Conteúdo bloqueado com preço e legenda</small></div><span class="seta">›</span></button>
    </div>`);
}

function seletor(id, multiplo, aceitar){
  return `<input type="file" id="${id}" accept="${aceitar}" ${multiplo ? "multiple" : ""} hidden>`;
}
function miniaturas(lista, alvo){
  $(alvo).innerHTML = lista.map((f, i) => {
    const url = URL.createObjectURL(f), video = f.type.startsWith("video");
    return `<div>${video ? `<video src="${url}" muted playsinline></video><span class="v">VÍDEO</span>` : `<img src="${url}" alt="">`}<button class="x" data-tirar="${i}">✕</button></div>`;
  }).join("");
}

function editarPerfil(){
  const c = D.criadora; let nova = null;
  abrirFolha(`<h2>Editar perfil</h2>
    <label for="perfil-foto">${c.tem_foto ? `<img class="foto-perfil-ed" id="prev-av" src="${avatarSrc()}" alt="">` : `<div class="foto-perfil-ed" id="prev-av">✨</div>`}</label>
    ${seletor("perfil-foto", false, "image/*")}
    <p class="dica" style="text-align:center;margin-top:0">Toque na foto para trocar</p>
    <span class="rotulo">Nome</span><input type="text" id="perfil-nome" maxlength="60" value="${esc(c.nome)}">
    <span class="rotulo">Bio</span><textarea id="perfil-bio" maxlength="700">${esc(c.bio)}</textarea>
    <div class="gap"></div><button class="btn" id="perfil-salvar">Salvar</button>`);
  $("#perfil-foto").onchange = e => { nova = e.target.files[0]; if(nova){ const u = URL.createObjectURL(nova); $("#prev-av").outerHTML = `<img class="foto-perfil-ed" id="prev-av" src="${u}" alt="">` } };
  $("#perfil-salvar").onclick = async () => {
    const b = $("#perfil-salvar"); b.disabled = true; b.textContent = "Salvando…";
    const r = await enviarForm("/api/criadora/perfil", {nome: $("#perfil-nome").value.trim(), bio: $("#perfil-bio").value.trim()}, nova ? [["foto", nova]] : []);
    if(!r.ok){ b.disabled = false; b.textContent = "Salvar"; return toast(r.erro || "Não consegui salvar") }
    vibrar("success"); toast("Perfil atualizado ✓"); fecharFolha(); PAINEL = null; carregar();
  };
}

function novoPost(){
  let foto = null;
  abrirFolha(`<h2>Nova publicação</h2><p class="sub">Aparece no feed para todos, sem cobrança.</p>
    <textarea id="post-texto" maxlength="4000" placeholder="Escreva algo para seus fãs…"></textarea>
    <div class="gap"></div>
    <label class="escolher" for="post-foto">📷 Adicionar foto (opcional)</label>${seletor("post-foto", false, "image/*")}
    <div class="miniaturas" id="post-mini"></div>
    <div class="gap"></div><button class="btn" id="post-publicar">Publicar</button>`);
  $("#post-foto").onchange = e => { foto = e.target.files[0] || null; miniaturas(foto ? [foto] : [], "#post-mini") };
  $("#post-mini").onclick = e => { if(e.target.dataset.tirar !== undefined){ foto = null; miniaturas([], "#post-mini") } };
  $("#post-publicar").onclick = async () => {
    const texto = $("#post-texto").value.trim();
    if(!texto && !foto) return toast("Escreva algo ou escolha uma foto");
    const b = $("#post-publicar"); b.disabled = true; b.textContent = "Publicando…";
    const r = await enviarForm("/api/criadora/post", {texto}, foto ? [["foto", foto]] : []);
    if(!r.ok){ b.disabled = false; b.textContent = "Publicar"; return toast(r.erro || "Não consegui publicar") }
    vibrar("success"); toast("Publicado ✓"); fecharFolha(); ABA = "inicio"; FILTRO = "todos"; PAINEL = null; carregar();
  };
}

function novoPack(){
  let arqs = [];
  abrirFolha(`<h2>Novo pack pago</h2><p class="sub">As prévias com desfoque são geradas sozinhas.</p>
    <label class="escolher" for="pack-arqs">🖼️ Escolher fotos e vídeos</label>${seletor("pack-arqs", true, "image/*,video/*")}
    <div class="miniaturas" id="pack-mini"></div>
    <span class="rotulo">Título</span><input type="text" id="pack-titulo" maxlength="80" placeholder="Ex: Ensaio de verão">
    <span class="rotulo">Preço</span><input type="text" id="pack-preco" inputmode="decimal" placeholder="29,90">
    <span class="rotulo">Legenda</span><textarea id="pack-legenda" maxlength="2000" placeholder="Conte o que tem nesse pack…"></textarea>
    ${PAINEL?.canal !== false ? `<div class="troca" style="margin:14px 0 0"><div><b>Postar prévia no canal</b><br><small class="muted">Canal de amostras, com botão de compra</small></div><span class="chave on" id="pack-canal"></span></div>` : ""}
    <div id="pack-prog" class="ocultar"><div class="progresso"><i id="pack-barra"></i></div><p class="dica" id="pack-etapa">Enviando…</p></div>
    <div class="gap"></div><button class="btn" id="pack-publicar">Publicar pack</button>`);
  $("#pack-arqs").onchange = e => { arqs = [...arqs, ...e.target.files].slice(0, 30); miniaturas(arqs, "#pack-mini"); e.target.value = "" };
  $("#pack-mini").onclick = e => { const i = e.target.dataset.tirar; if(i !== undefined){ arqs.splice(+i, 1); miniaturas(arqs, "#pack-mini") } };
  $("#pack-canal") && ($("#pack-canal").onclick = e => e.currentTarget.classList.toggle("on"));
  $("#pack-publicar").onclick = async () => {
    if(!arqs.length) return toast("Escolha pelo menos uma foto ou vídeo");
    const titulo = $("#pack-titulo").value.trim(), preco = $("#pack-preco").value.trim();
    if(!titulo) return toast("Dê um título ao pack");
    if(!preco) return toast("Defina o preço");
    const grande = arqs.find(f => f.type.startsWith("video") && f.size > 49 * 1024 * 1024);
    if(grande) return toast("Um vídeo passa de 50 MB, o limite do Telegram. Envie esse pelo bot.");
    const b = $("#pack-publicar"); b.disabled = true; b.textContent = "Publicando…";
    $("#pack-prog").classList.remove("ocultar");
    const r = await enviarForm("/api/criadora/pack",
      {titulo, preco, legenda: $("#pack-legenda").value.trim(), canal: $("#pack-canal")?.classList.contains("on") ? "1" : "0"},
      arqs.map(f => ["arquivos", f]),
      p => { $("#pack-barra").style.width = `${Math.round(p * 100)}%`; $("#pack-etapa").textContent = p < 1 ? `Enviando ${Math.round(p * 100)}%…` : "Gerando as prévias com desfoque…" });
    if(!r.ok){ b.disabled = false; b.textContent = "Publicar pack"; $("#pack-prog").classList.add("ocultar"); return toast(r.erro || "Não consegui publicar") }
    vibrar("success"); toast(r.no_canal ? "Pack publicado e postado no canal ✓" : "Pack publicado ✓");
    fecharFolha(); ABA = "inicio"; FILTRO = "todos"; PAINEL = null; carregar();
  };
}

function menuItem(alvo){
  const [tipo, id] = alvo.split(":");
  if(tipo === "post"){
    const p = D.posts.find(x => String(x.id) === id); if(!p) return;
    abrirFolha(`<h2>Editar publicação</h2>
      <textarea id="ed-texto" maxlength="4000">${esc(p.texto)}</textarea>
      <div class="gap"></div><button class="btn" id="ed-salvar">Salvar</button><div class="gap"></div>
      <button class="btn fantasma perigo" id="ed-apagar">Apagar publicação</button>`);
    $("#ed-salvar").onclick = async () => {
      const r = await api(`/api/criadora/post/${id}`, {texto: $("#ed-texto").value.trim()});
      if(!r.ok) return toast(r.erro || "Não consegui salvar"); toast("Salvo ✓"); fecharFolha(); carregar();
    };
    $("#ed-apagar").onclick = () => confirmar("Apagar esta publicação?", async () => { await api(`/api/criadora/post/${id}/apagar`, {}); toast("Apagada"); fecharFolha(); carregar() });
    return;
  }
  const p = D.packs.find(x => x.id === id); if(!p) return;
  abrirFolha(`<h2>Editar pack</h2>
    <span class="rotulo">Título</span><input type="text" id="ed-titulo" maxlength="80" value="${esc(p.titulo)}">
    <span class="rotulo">Preço</span><input type="text" id="ed-preco" inputmode="decimal" value="${esc(p.preco_fmt.replace("R$ ", ""))}">
    <span class="rotulo">Legenda</span><textarea id="ed-legenda" maxlength="2000">${esc(p.legenda || "")}</textarea>
    <div class="gap"></div><button class="btn" id="ed-salvar">Salvar</button><div class="gap"></div>
    <button class="btn sec" id="ed-ver">👁 Ver conteúdo</button><div class="gap"></div>
    <button class="btn fantasma perigo" id="ed-apagar">Tirar da vitrine</button>
    <p class="dica" style="text-align:center">Quem já comprou continua com acesso.</p>`);
  $("#ed-ver").onclick = () => abrirGaleria(id);
  $("#ed-salvar").onclick = async () => {
    const r = await api(`/api/criadora/pack/${id}`, {titulo: $("#ed-titulo").value.trim(), preco: $("#ed-preco").value.trim(), legenda: $("#ed-legenda").value.trim()});
    if(!r.ok) return toast(r.erro || "Não consegui salvar"); toast("Salvo ✓"); fecharFolha(); carregar();
  };
  $("#ed-apagar").onclick = () => confirmar(`Tirar "${p.titulo}" da vitrine?`, async () => { await api(`/api/criadora/pack/${id}/apagar`, {}); toast("Removido da vitrine"); fecharFolha(); PAINEL = null; carregar() });
}

function confirmar(texto, sim){
  if(tg?.showConfirm){ try{ return tg.showConfirm(texto, ok => ok && sim()) }catch(e){} }
  if(window.confirm(texto)) sim();
}

function editarMensagens(){
  const M = PAINEL?.mensagens || [];
  abrirFolha(`<h2>Mensagens do bot</h2><p class="sub">Edite o que o bot manda para seus fãs.</p>
    <div class="acoes" style="padding:0">${M.map(m => `<button class="acao" data-msg="${m.chave}"><span class="ico">💬</span>
      <div style="min-width:0"><b>${esc(m.rotulo)}</b><small style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(m.texto || "Padrão: " + (m.padrao || "bio do perfil"))}</small></div><span class="seta">›</span></button>`).join("")}</div>`);
}
function editarMensagem(chave){
  const m = PAINEL.mensagens.find(x => x.chave === chave); let foto = null, remover = false;
  const comFoto = chave === "boas_vindas";
  const exemplo = t => (t || "").replaceAll("{nome}", D.usuario.nome || "Ana").replaceAll("{criadora}", D.criadora.nome).replaceAll("{item}", "Ensaio de verão");
  abrirFolha(`<h2>${esc(m.rotulo)}</h2>
    <textarea id="msg-texto" maxlength="3500" placeholder="${esc(m.padrao || "Vazio: usa a bio e a foto do perfil")}">${esc(m.texto)}</textarea>
    <p class="dica">Marcadores: <code>{nome}</code> nome do fã · <code>{criadora}</code> seu nome${chave !== "boas_vindas" ? ` · <code>{item}</code> o que foi comprado` : ""}</p>
    ${comFoto ? `<div class="gap"></div><label class="escolher" for="msg-foto">📷 ${m.foto ? "Trocar a foto" : "Adicionar foto"}</label>${seletor("msg-foto", false, "image/*")}
      ${m.foto ? `<button class="btn fantasma perigo" id="msg-sem-foto">Remover foto</button>` : ""}` : ""}
    <span class="rotulo">Prévia</span>
    <div class="balao" id="msg-prev"></div>
    <div class="gap"></div><button class="btn" id="msg-salvar">Salvar</button>`);
  const prev = () => {
    const img = foto ? URL.createObjectURL(foto) : (comFoto && m.foto && !remover ? `/api/loja/msg_foto/${chave}?t=${Date.now()}` : "");
    $("#msg-prev").innerHTML = `${img ? `<img src="${img}" alt="">` : ""}<p>${esc(exemplo($("#msg-texto").value || m.padrao || D.criadora.bio))}</p>`;
  };
  $("#msg-texto").oninput = prev; prev();
  if(comFoto){
    $("#msg-foto").onchange = e => { foto = e.target.files[0] || null; remover = false; prev() };
    $("#msg-sem-foto") && ($("#msg-sem-foto").onclick = () => { remover = true; foto = null; prev(); toast("A foto será removida ao salvar") });
  }
  $("#msg-salvar").onclick = async () => {
    const b = $("#msg-salvar"); b.disabled = true; b.textContent = "Salvando…";
    const r = await enviarForm("/api/criadora/mensagem", {chave, texto: $("#msg-texto").value.trim(), remover_foto: remover ? "1" : "0"}, foto ? [["foto", foto]] : []);
    if(!r.ok){ b.disabled = false; b.textContent = "Salvar"; return toast(r.erro || "Não consegui salvar") }
    vibrar("success"); toast("Mensagem salva ✓"); await carregarPainel(); editarMensagens();
  };
}

/* ── Galeria ───────────────────────────────────────────────────────────── */
async function abrirGaleria(id){
  fecharGaleria(); fecharFolha();
  const p = D.packs.find(x => x.id === id) || D.combos.find(x => x.id === id) || D.minhas.find(x => x.id === id) || {};
  const g = document.createElement("div"); g.className = "galeria"; g.id = "galeria";
  g.innerHTML = `
    <header>${D.criadora.tem_foto ? `<img class="av" src="/api/loja/foto" alt="">` : `<div class="av">✨</div>`}
      <div class="t"><b>${esc(p.titulo || "Conteúdo")}</b><small>${esc(D.criadora.nome)}</small></div>
      <button id="g-fechar" aria-label="Fechar">✕</button></header>
    <span class="contador" id="g-cont"></span>
    <button class="seta-g esq" id="g-esq">‹</button><button class="seta-g dir" id="g-dir">›</button>
    <div class="trilho" id="trilho"><div class="slide"><div class="carregando"><i></i></div></div></div>
    <footer><div class="pontos" id="g-pontos"></div>
      <div class="rodape-g"><button class="btn sec" data-reenviar="${esc(id)}">📩 Receber no chat</button></div></footer>`;
  g.addEventListener("contextmenu", e => e.preventDefault());
  document.body.appendChild(g); document.body.style.overflow = "hidden";
  $("#g-fechar").onclick = fecharGaleria;
  try{ tg?.BackButton?.show(); tg?.BackButton?.onClick(fecharGaleria) }catch(e){}

  const r = await api(`/api/loja/conteudo/${id}`);
  if(!r.ok || !r.midias?.length){ $("#trilho").innerHTML = `<div class="slide"><div class="grande"><div class="ico">😕</div>Não consegui abrir agora. Toque em "Receber no chat".</div></div>`; return }
  const M = r.midias;
  $("#trilho").innerHTML = M.map((m, i) => `<div class="slide" data-i="${i}">${
    m.grande ? `<div class="grande"><div class="ico">🎬</div><b>Vídeo grande demais para abrir aqui</b><button class="btn mini" data-reenviar="${esc(id)}">Assistir no chat</button></div>`
    : m.tipo === "video" ? `<video src="${m.url}" playsinline controls preload="metadata" controlslist="nodownload noplaybackrate" disablepictureinpicture></video>`
    : `<div class="carregando"><i></i></div><img src="${m.url}" alt="" draggable="false" ${i > 1 ? 'loading="lazy"' : ""} onload="this.previousElementSibling?.remove()">`
  }</div>`).join("");
  $("#g-pontos").innerHTML = M.length > 1 ? M.map((_, i) => `<i class="${i ? "" : "on"}"></i>`).join("") : "";
  const tr = $("#trilho");
  const atual = () => Math.round(tr.scrollLeft / tr.clientWidth);
  const marcar = () => {
    const i = atual();
    $("#g-cont").textContent = `${i + 1}/${M.length}`;
    document.querySelectorAll("#g-pontos i").forEach((d, j) => d.classList.toggle("on", j === i));
    document.querySelectorAll("#trilho video").forEach(v => { if(+v.parentElement.dataset.i !== i) v.pause() });
  };
  tr.addEventListener("scroll", () => { clearTimeout(tr._t); tr._t = setTimeout(marcar, 60) }, {passive:true});
  const ir = d => { tr.scrollTo({left: (atual() + d) * tr.clientWidth, behavior:"smooth"}); vibrar("leve") };
  $("#g-esq").onclick = () => ir(-1); $("#g-dir").onclick = () => ir(1);
  marcar();
}
function fecharGaleria(){
  const g = $("#galeria"); if(!g) return;
  g.querySelectorAll("video").forEach(v => { v.pause(); v.removeAttribute("src"); v.load() });
  g.remove(); document.body.style.overflow = "";
  try{ tg?.BackButton?.offClick(fecharGaleria); tg?.BackButton?.hide() }catch(e){}
}

/* ── Eventos ───────────────────────────────────────────────────────────── */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-curtir],[data-mimo],[data-mimo-outro],[data-periodo],[data-modo],[data-menu],[data-criar],[data-msg],#ed-perfil,#ed-perfil2,#ed-msgs,#como-fa,[data-reenviar],[data-ver],[data-aba],[data-vista],[data-filtro],[data-plano],[data-item],#pagar,#assinar,#gorjeta-ok");
  if(!el) return;
  if(el.dataset.modo){ COMO_FA = el.dataset.modo === "cliente"; ABA = "inicio"; vibrar("leve");
    if(!PLANO_SEL) PLANO_SEL = (D.planos.find(p => p.economia) || D.planos[0])?.id; return render() }
  if(el.dataset.curtir){ return curtir(el) }
  if(el.dataset.mimo){ return mimoPara(el.dataset.mimo) }
  if(el.dataset.mimoOutro){
    const v = Math.round(parseFloat(($("#mimo-outro").value || "").replace(/\./g,"").replace(",", ".")) * 100);
    if(!v || v < 100){ toast("Valor mínimo: R$ 1,00"); return }
    return pagar(`gorjeta_${v}_${el.dataset.mimoOutro}`);
  }
  if(el.dataset.periodo){ PERIODO = el.dataset.periodo; vibrar("leve"); $("#conteudo").innerHTML = painel(); return }
  if(el.dataset.menu){ e.stopPropagation(); return menuItem(el.dataset.menu) }
  if(el.dataset.criar){ return el.dataset.criar === "post" ? novoPost() : novoPack() }
  if(el.dataset.msg){ return editarMensagem(el.dataset.msg) }
  if(el.id === "ed-perfil" || el.id === "ed-perfil2"){ return editarPerfil() }
  if(el.id === "ed-msgs"){ return PAINEL ? editarMensagens() : carregarPainel().then(editarMensagens) }
  if(el.id === "como-fa"){ COMO_FA = true; ABA = "inicio"; vibrar("leve"); render(); toast("Vendo a loja como seus fãs"); return }
  if(el.dataset.aba){ ABA = el.dataset.aba; vibrar("leve"); render(); window.scrollTo({top: ABA === "inicio" ? 0 : 120, behavior:"smooth"}); return }
  if(el.dataset.vista){ VISTA = el.dataset.vista; render(); return }
  if(el.dataset.filtro){ FILTRO = el.dataset.filtro; render(); return }
  if(el.dataset.plano){ PLANO_SEL = el.dataset.plano; vibrar("leve"); render(); return }
  if(el.id === "pagar"){ pagar(el.dataset.item, $("#cupom")?.value.trim()); return }
  if(el.id === "assinar"){ detalhes(el.dataset.item); return }
  if(el.id === "gorjeta-ok"){
    const v = Math.round(parseFloat(($("#gorjeta-outro").value || "").replace(/\./g,"").replace(",", ".")) * 100);
    if(!v || v < 100){ toast("Valor mínimo: R$ 1,00"); return }
    return pagar(`gorjeta_${v}`);
  }
  if(el.dataset.reenviar){ reenviar(el.dataset.reenviar); return }
  if(el.dataset.ver){ abrirGaleria(el.dataset.ver); return }
  if(el.dataset.item){
    const id = el.dataset.item;
    if(id.startsWith("gorjeta_")) return pagar(id);
    detalhes(id);
  }
});

carregar();
</script>
</body>
</html>
