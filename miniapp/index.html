<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Loja</title>
<!-- Script oficial do Telegram: entrega o initData, o tema e os eventos do Mini App -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ── Tema ─────────────────────────────────────────────────────────────── */
:root{
  --bg: var(--tg-theme-bg-color, #0b0d12);
  --bg2: var(--tg-theme-secondary-bg-color, #141821);
  --card: color-mix(in srgb, var(--bg2) 85%, white 4%);
  --text: var(--tg-theme-text-color, #f4f5f8);
  --muted: var(--tg-theme-hint-color, #8b93a3);
  --line: color-mix(in srgb, var(--text) 9%, transparent);
  --a1: #ff2e7e; --a2: #ff7a3d;                 /* gradiente da marca */
  --accent: var(--a1);
  --grad: linear-gradient(135deg, var(--a1), var(--a2));
  --ok: #2fd27a; --warn: #ffb648; --err: #ff5d5d;
  --r: 20px; --rs: 14px;
  --sombra: 0 10px 30px rgba(0,0,0,.25);
  --nav-h: 64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;overscroll-behavior-y:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
img{display:block}
main{max-width:560px;margin:0 auto;padding:0 0 calc(var(--nav-h) + 24px + env(safe-area-inset-bottom))}
.pad{padding:0 16px}
h2{margin:0;font-size:19px;letter-spacing:-.01em}
.muted{color:var(--muted)}
.ocultar{display:none !important}

/* ── Topo / perfil ─────────────────────────────────────────────────────── */
.capa{position:relative;height:150px;overflow:hidden;background:var(--grad)}
.capa img{width:100%;height:100%;object-fit:cover;filter:blur(18px) saturate(1.4) brightness(.75);transform:scale(1.25)}
.capa::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,var(--bg) 100%)}
.capa .bolha{position:absolute;border-radius:50%;filter:blur(30px);opacity:.75;animation:flutua 9s ease-in-out infinite alternate}
.capa .b1{width:220px;height:220px;left:-60px;top:-80px;background:#ff2e7e}
.capa .b2{width:200px;height:200px;right:-40px;top:-50px;background:#ff7a3d;animation-delay:-4s}
.capa .b3{width:160px;height:160px;left:40%;top:40px;background:#7b5cff;animation-delay:-7s}
@keyframes flutua{to{transform:translate(18px,14px) scale(1.08)}}
.perfil{position:relative;padding:0 16px;margin-top:-46px;display:flex;flex-direction:column;align-items:center;text-align:center}
.avatar{width:96px;height:96px;border-radius:50%;object-fit:cover;background:var(--grad);display:grid;place-items:center;font-size:40px;color:#fff;border:4px solid var(--bg);box-shadow:var(--sombra)}
.nome{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:22px;font-weight:800;letter-spacing:-.02em}
.verif{width:20px;height:20px;border-radius:50%;background:var(--grad);display:inline-grid;place-items:center;color:#fff;font-size:12px;font-weight:900}
.bio{color:var(--muted);font-size:14px;margin:4px 0 0;max-width:420px}
.stats{display:flex;gap:28px;margin:14px 0 4px}
.stats div{text-align:center}
.stats b{display:block;font-size:17px;letter-spacing:-.01em}
.stats small{color:var(--muted);font-size:12px}
.cta-vip{margin:14px 16px 0;position:relative;overflow:hidden;border-radius:var(--r);padding:16px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 14px 34px color-mix(in srgb,var(--a1) 35%,transparent);cursor:pointer}
.cta-vip::before{content:"";position:absolute;inset:-40%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.35),transparent 45%);pointer-events:none}
.cta-vip b{display:block;font-size:16px}
.cta-vip small{opacity:.9;font-size:13px}
.cta-vip .seta{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:18px;flex:none}
.vip-ativo{margin:14px 16px 0;border-radius:var(--r);padding:14px 16px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;gap:12px}
.vip-ativo .ico{width:40px;height:40px;border-radius:12px;background:var(--grad);display:grid;place-items:center;color:#fff;font-size:18px;flex:none}
.vip-ativo b{display:block}
.vip-ativo small{color:var(--muted)}
.barra-prog{height:5px;border-radius:5px;background:var(--line);margin-top:8px;overflow:hidden}
.barra-prog i{display:block;height:100%;background:var(--grad);border-radius:5px}

/* ── Filtros / seções ──────────────────────────────────────────────────── */
.secao-titulo{display:flex;align-items:center;justify-content:space-between;padding:22px 16px 10px}
.secao-titulo h2{font-size:17px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted);transition:.2s}
.chip.on{background:var(--text);color:var(--bg);border-color:transparent}
.alt-vista{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
.alt-vista button{width:30px;height:26px;border-radius:7px;color:var(--muted);font-size:14px}
.alt-vista button.on{background:var(--bg);color:var(--text)}

/* ── Feed (posts estilo Privacy) ───────────────────────────────────────── */
.feed{display:flex;flex-direction:column;gap:14px;padding:0 16px}
.post{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sombra)}
.post .cab{display:flex;align-items:center;gap:10px;padding:12px 14px}
.post .cab .mini-av{width:34px;height:34px;border-radius:50%;background:var(--grad);display:grid;place-items:center;color:#fff;font-size:15px;object-fit:cover}
.post .cab b{display:block;font-size:14px}
.post .cab small{color:var(--muted);font-size:12px}
.midia{position:relative;aspect-ratio:4/5;background:#1a1f2a;overflow:hidden;cursor:pointer}
.midia img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.post:active .midia img{transform:scale(1.03)}
.midia .veu{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.45));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff}
.cadeado{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.14);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.3);display:grid;place-items:center;font-size:26px}
.desbloq{background:#fff;color:#111;border-radius:999px;padding:10px 18px;font-weight:800;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.comprado-selo{position:absolute;top:12px;left:12px;background:var(--ok);color:#042;font-weight:800;font-size:12px;padding:5px 10px;border-radius:999px}
.tag-combo{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);color:#fff;font-weight:700;font-size:12px;padding:5px 10px;border-radius:999px}
.midia .contagem{position:absolute;bottom:12px;left:12px;display:flex;gap:6px}
.pill{background:rgba(0,0,0,.55);backdrop-filter:blur(8px);color:#fff;font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px}
.post .rodape{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px}
.post .rodape b{font-size:15px}
.post .rodape small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.preco-tag{background:var(--grad);color:#fff;font-weight:800;padding:8px 14px;border-radius:999px;font-size:14px;white-space:nowrap}
.preco-tag.ok{background:var(--card);color:var(--ok);border:1px solid var(--line)}

/* grade compacta */
.grade{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:0 16px}
.grade .card{position:relative;border-radius:var(--rs);overflow:hidden;background:var(--card);cursor:pointer}
.grade .card img{width:100%;aspect-ratio:3/4;object-fit:cover}
.grade .card .veu{position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.7));display:flex;flex-direction:column;justify-content:flex-end;padding:10px;color:#fff}
.grade .card .veu b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grade .card .veu small{font-size:12px;opacity:.9}
.grade .card .cad{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.18);backdrop-filter:blur(8px);display:grid;place-items:center;font-size:14px}

/* ── VIP ───────────────────────────────────────────────────────────────── */
.hero-vip{margin:16px;border-radius:var(--r);padding:22px 18px;background:var(--grad);color:#fff;position:relative;overflow:hidden}
.hero-vip::after{content:"";position:absolute;right:-10px;bottom:-24px;width:130px;height:130px;opacity:.16;transform:rotate(-15deg);background:#fff;-webkit-mask:var(--estrela) center/contain no-repeat;mask:var(--estrela) center/contain no-repeat}
.hero-vip h2{font-size:24px;color:#fff}
.hero-vip p{margin:6px 0 0;opacity:.92;font-size:14px}
.beneficios{margin:0 16px 14px;display:grid;gap:8px}
.beneficio{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--rs);padding:12px 14px;font-size:14px}
.beneficio .ico{width:36px;height:36px;border-radius:11px;background:color-mix(in srgb,var(--a1) 14%,transparent);display:grid;place-items:center;font-size:17px;flex:none}
.planos{padding:0 16px;display:grid;gap:10px}
.plano{position:relative;display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;transition:.2s}
.plano.on{border-color:var(--a1);background:color-mix(in srgb,var(--a1) 8%,var(--card));box-shadow:0 0 0 4px color-mix(in srgb,var(--a1) 14%,transparent)}
.plano .radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;flex:none}
.plano.on .radio{border-color:var(--a1);background:var(--a1)}
.plano.on .radio::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.plano .txt{flex:1}
.plano b{font-size:16px}
.plano small{display:block;color:var(--muted);font-size:12.5px}
.plano .valor{text-align:right}
.plano .valor b{font-size:17px}
.plano .valor small{font-size:11.5px}
.eco{display:inline-block;background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok);font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;margin-left:6px;vertical-align:middle}
.popular{position:absolute;top:-10px;right:14px;background:var(--grad);color:#fff;font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px;letter-spacing:.02em}
.fixo-cta{position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 10px);padding:12px 16px 0;z-index:4}

/* ── Minhas / Mimos ────────────────────────────────────────────────────── */
.lista{padding:0 16px;display:grid;gap:10px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--rs);padding:10px 12px}
.item img,.item .thumb{width:54px;height:54px;border-radius:12px;object-fit:cover;background:var(--grad);display:grid;place-items:center;font-size:22px;color:#fff;flex:none}
.item .txt{flex:1;min-width:0}
.item b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14.5px}
.item small{color:var(--muted);font-size:12.5px}
.mimos{padding:0 16px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.mimo{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:18px 14px;text-align:left;transition:.2s}
.mimo:active{transform:scale(.97)}
.mimo .emoji{font-size:28px}
.mimo b{display:block;font-size:19px;margin-top:6px;letter-spacing:-.01em}
.mimo small{color:var(--muted);font-size:12px}
.campo{display:flex;gap:8px;padding:12px 16px 0}
.campo input{flex:1}
input[type=text]{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;color:var(--text);font-size:15px;outline:none;transition:.2s}
input:focus{border-color:var(--a1)}
input::placeholder{color:var(--muted)}

/* ── Botões ────────────────────────────────────────────────────────────── */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border-radius:16px;padding:15px;background:var(--grad);color:#fff;font-weight:800;font-size:15.5px;box-shadow:0 10px 26px color-mix(in srgb,var(--a1) 30%,transparent);transition:.15s}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.55;box-shadow:none}
.btn.sec{background:var(--card);color:var(--text);box-shadow:none;border:1px solid var(--line)}
.btn.fantasma{background:transparent;color:var(--muted);box-shadow:none;padding:10px}
.btn.mini{width:auto;padding:9px 14px;font-size:13px;border-radius:12px}
.vazio{text-align:center;padding:48px 24px;color:var(--muted)}
.vazio .ico{font-size:44px;margin-bottom:8px}

/* ── Barra inferior ────────────────────────────────────────────────────── */
.barra{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;padding:0 12px calc(10px + env(safe-area-inset-bottom))}
.barra nav{display:flex;width:100%;max-width:536px;height:var(--nav-h);background:color-mix(in srgb,var(--bg2) 78%,transparent);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 40px rgba(0,0,0,.35);padding:6px}
.barra nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:16px;color:var(--muted);font-size:11px;font-weight:600;transition:.2s}
.barra nav button .ico{font-size:20px;line-height:1;transition:transform .2s}
.barra nav button.on{color:var(--text);background:color-mix(in srgb,var(--text) 7%,transparent)}
.barra nav button.on .ico{transform:translateY(-1px) scale(1.08)}
.barra nav button .dot{position:absolute}

/* ── Folha (bottom sheet) ──────────────────────────────────────────────── */
.fundo{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:30;display:flex;align-items:flex-end;justify-content:center;animation:surge .2s}
@keyframes surge{from{opacity:0}}
.folha{position:relative;background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:26px 26px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));animation:sobe .32s cubic-bezier(.2,.8,.2,1)}
@keyframes sobe{from{transform:translateY(60px);opacity:.4}}
.alca{width:42px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 14px}
.fechar{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;background:var(--card);color:var(--muted);font-size:16px;display:grid;place-items:center}
.previa-wrap{position:relative;border-radius:var(--r);overflow:hidden;margin-bottom:14px;max-height:48vh}
.previa-wrap img{width:100%;max-height:48vh;object-fit:cover}
.previa-wrap .veu{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.25)}
.midia-chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.midia-chips span{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12.5px;color:var(--muted)}
.linha-preco{display:flex;justify-content:space-between;align-items:baseline;margin:10px 0 14px}
.linha-preco s{color:var(--muted);margin-right:8px;font-size:15px}
.linha-preco .v{font-size:26px;font-weight:900;letter-spacing:-.02em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.cupom-toggle{font-size:13.5px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:4px 0 12px;display:inline-block}
.cupom-wrap{display:none;margin-bottom:12px}
.cupom-wrap.on{display:block}
.gap{height:10px}
.sub{color:var(--muted);font-size:14px;margin:4px 0 12px}
.aviso{font-size:13px;color:var(--warn);margin:-4px 0 10px}
.aviso.ok{color:var(--ok)}
/* PIX */
.valor-pix{text-align:center;margin:4px 0 14px}
.valor-pix .v{font-size:34px;font-weight:900;letter-spacing:-.03em}
.valor-pix small{color:var(--muted)}
.qr-card{background:#fff;border-radius:22px;padding:14px;width:min(250px,70vw);margin:0 auto 14px;box-shadow:var(--sombra)}
.qr-card img{width:100%}
.codigo{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.codigo code{flex:1;font:12px ui-monospace,Menlo,Consolas,monospace;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{display:flex;align-items:center;gap:8px;justify-content:center;color:var(--muted);font-size:13.5px;margin:12px 0}
.pulso{width:9px;height:9px;border-radius:50%;background:var(--warn);animation:p 1.2s infinite}
@keyframes p{50%{opacity:.25;transform:scale(.8)}}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--text)}
.passos{display:grid;gap:6px;margin:4px 0 14px;font-size:13px;color:var(--muted)}
.passos div{display:flex;gap:8px}
.passos i{font-style:normal;width:20px;height:20px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:11px;color:var(--text);flex:none}
/* sucesso */
.ok-grande{text-align:center;padding:18px 8px 8px}
.check{width:92px;height:92px;border-radius:50%;background:var(--grad);margin:0 auto 14px;display:grid;place-items:center;color:#fff;font-size:44px;animation:pop .5s cubic-bezier(.2,1.4,.4,1);box-shadow:0 16px 40px color-mix(in srgb,var(--a1) 40%,transparent)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.ok-grande .emoji{font-size:60px;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 28px);transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;z-index:70;font-size:13.5px;font-weight:600;box-shadow:var(--sombra);animation:toast-in .35s cubic-bezier(.2,1.2,.4,1);transition:opacity .25s,transform .25s;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.sai{opacity:0;transform:translate(-50%,10px)}
@keyframes toast-in{from{opacity:0;transform:translate(-50%,18px) scale(.94)}}

/* ── Skeleton ──────────────────────────────────────────────────────────── */
.sk{background:linear-gradient(90deg,var(--card) 25%,color-mix(in srgb,var(--card) 70%,white 6%) 50%,var(--card) 75%);background-size:200% 100%;animation:sk 1.3s infinite;border-radius:14px}
@keyframes sk{to{background-position:-200% 0}}
.preco-tag.ok{cursor:pointer}
.item{cursor:pointer}

/* ── Posts de texto e legendas ───────────────────────────────────────── */
.legenda{padding:0 14px 12px;font-size:14.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.legenda.mais{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.post-texto .corpo{padding:0 14px 14px;font-size:15.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.post-texto img.foto-post{width:100%;max-height:560px;object-fit:cover}
.post .cab{position:relative}
.menu-post{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;color:var(--muted);font-size:18px;display:grid;place-items:center}
.menu-post:active{background:var(--line)}
/* ── Modo criadora ─────────────────────────────────────────────────────── */
.selo-criadora{display:inline-flex;align-items:center;gap:6px;margin-top:10px;background:color-mix(in srgb,var(--a1) 14%,transparent);color:var(--a1);font-size:12px;font-weight:800;padding:5px 11px;border-radius:999px}
.avatar-wrap{position:relative;cursor:pointer}
.avatar-wrap .lapis{position:absolute;right:0;bottom:2px;width:30px;height:30px;border-radius:50%;background:var(--text);color:var(--bg);display:grid;place-items:center;font-size:14px;border:3px solid var(--bg)}
.fab{position:fixed;right:18px;bottom:calc(var(--nav-h) + 26px + env(safe-area-inset-bottom));z-index:11;width:58px;height:58px;border-radius:20px;background:var(--grad);color:#fff;font-size:30px;font-weight:300;display:grid;place-items:center;box-shadow:0 14px 34px color-mix(in srgb,var(--a1) 45%,transparent)}
.fab:active{transform:scale(.94)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi small{color:var(--muted);font-size:12px;font-weight:600}
.kpi b{display:block;font-size:21px;letter-spacing:-.02em;margin-top:2px}
.kpi span{color:var(--muted);font-size:12.5px}
.kpi.destaque{background:var(--grad);color:#fff;border:0}
.kpi.destaque small,.kpi.destaque span{color:rgba(255,255,255,.85)}
.acoes{display:grid;gap:10px;padding:0 16px}
.acao{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;width:100%}
.acao .ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:21px;flex:none;background:color-mix(in srgb,var(--a1) 13%,transparent)}
.acao b{display:block;font-size:15px}
.acao small{color:var(--muted);font-size:12.5px}
.acao .seta{margin-left:auto;color:var(--muted);font-size:20px}
.troca{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:0 16px}
.chave{position:relative;width:50px;height:30px;border-radius:999px;background:var(--line);transition:.2s;flex:none}
.chave::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.chave.on{background:var(--ok)}
.chave.on::after{transform:translateX(20px)}
.rotulo{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:14px 0 6px}
textarea{width:100%;min-height:110px;resize:vertical;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--text);font:15px/1.5 inherit;font-family:inherit;outline:none}
textarea:focus{border-color:var(--a1)}
.escolher{display:flex;align-items:center;justify-content:center;gap:8px;border:2px dashed var(--line);border-radius:var(--r);padding:20px;color:var(--muted);font-weight:700;cursor:pointer;width:100%;background:transparent}
.interacoes{display:flex;align-items:center;gap:6px;padding:0 10px 12px;margin-top:-4px}
.interacao{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;font-size:14px;font-weight:700;color:var(--text);background:transparent}
.interacao:active{background:var(--line)}
.interacao.on{color:var(--a1)}
.interacao .coracao{font-size:18px;line-height:1;display:inline-block}
.interacao{position:relative}
.interacao.pop .coracao{animation:pulo .4s ease}
/* coração desenhado: contorno quando solto, gradiente da marca quando curtido */
.interacao .coracao svg{width:22px;height:22px;display:block;overflow:visible}
.cor-f{fill:transparent;stroke:currentColor;stroke-width:1.9;stroke-linejoin:round;transform-box:fill-box;transform-origin:center;transition:fill .2s,stroke .2s}
.interacao.on .cor-f{fill:url(#g-coracao);stroke:transparent}
.cor-anel{fill:none;stroke:var(--a1);opacity:0;transform-box:fill-box;transform-origin:center}
.interacao.pop .coracao{animation:none}
.interacao.pop .cor-f{animation:enche .5s cubic-bezier(.2,1.5,.4,1)}
.interacao.pop .cor-anel{animation:cor-anel-pop .55s ease-out}
.interacao.solta .cor-f{animation:solta .28s ease}
@keyframes enche{0%{transform:scale(.15)}55%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes cor-anel-pop{0%{opacity:.9;transform:scale(.25);stroke-width:7}100%{opacity:0;transform:scale(1.55);stroke-width:0}}
@keyframes solta{40%{transform:scale(.78)}100%{transform:scale(1)}}
.interacao .n{display:inline-block;min-width:1ch;font-variant-numeric:tabular-nums}
.interacao.sobe .n{animation:conta-sobe .3s ease}
.interacao.desce .n{animation:desce-n .3s ease}
@keyframes conta-sobe{from{transform:translateY(70%);opacity:0}}
@keyframes desce-n{from{transform:translateY(-70%);opacity:0}}
.coracao-grande svg{width:110px;height:110px;display:block}
.interacao.info{color:var(--muted);font-size:13px;font-weight:600;margin-left:auto}
@keyframes pulo{40%{transform:scale(1.5)}100%{transform:scale(1)}}
.seg{display:flex;gap:4px;margin:0 16px 10px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.seg button{flex:1;height:34px;border-radius:10px;font-weight:700;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--text);color:var(--bg)}
.kpis.tres{grid-template-columns:repeat(3,1fr)}
.kpis.tres .kpi b{font-size:17px}
.grafico{margin:0 16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 14px 10px}
.grafico .barras{display:flex;align-items:flex-end;gap:5px;height:120px}
.grafico .col{flex:1;border-radius:6px 6px 3px 3px;background:color-mix(in srgb,var(--a1) 22%,transparent);min-height:3px;position:relative}
.grafico .col.hoje{background:var(--grad)}
.grafico .eixo{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:8px}
.grafico .topo{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.grafico .topo b{font-size:20px;letter-spacing:-.02em}
.divisao{display:flex;height:10px;border-radius:999px;overflow:hidden;margin:12px 0 10px;background:var(--line)}
.legendas{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.legendas i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.ranking{margin:0 16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ranking .linha{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line)}
.ranking .linha:first-child{border-top:0}
.ranking .pos{width:22px;font-weight:800;color:var(--muted);text-align:center}
.ranking img{width:42px;height:42px;border-radius:10px;object-fit:cover}
.ranking .txt{flex:1;min-width:0}
.ranking .txt b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ranking .txt small{color:var(--muted);font-size:12px}
.ranking .v{font-weight:800;font-size:14px}
.miniaturas{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.miniaturas div{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--card)}
.miniaturas img,.miniaturas video{width:100%;height:100%;object-fit:cover}
.miniaturas .x{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:12px;display:grid;place-items:center}
.miniaturas .v{position:absolute;bottom:4px;left:4px;background:rgba(0,0,0,.6);color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:999px}
.progresso{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin:14px 0 6px}
.progresso i{display:block;height:100%;width:0;background:var(--grad);transition:width .2s}
.dica{font-size:12.5px;color:var(--muted);margin-top:6px}
.dica code{background:var(--card);border:1px solid var(--line);padding:1px 6px;border-radius:6px;font-size:12px}
.balao{background:var(--card);border:1px solid var(--line);border-radius:18px 18px 18px 6px;overflow:hidden;max-width:88%;margin-top:6px}
.balao img{width:100%;max-height:220px;object-fit:cover}
.balao p{margin:0;padding:10px 12px;white-space:pre-wrap;font-size:14px}
.perigo{color:var(--err) !important}
.lista-msg .acao .ico{background:color-mix(in srgb,#7b5cff 16%,transparent)}
.foto-perfil-ed{width:110px;height:110px;border-radius:50%;object-fit:cover;margin:4px auto 8px;display:grid;place-items:center;background:var(--grad);font-size:44px;color:#fff;cursor:pointer}

/* ── Galeria (carrossel do conteúdo comprado) ─────────────────────────── */
.galeria{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column;animation:surge .2s;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.galeria header{position:absolute;top:0;left:0;right:0;z-index:2;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 24px;background:linear-gradient(180deg,rgba(0,0,0,.7),transparent);color:#fff}
.galeria header .av{width:34px;height:34px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-size:15px;flex:none;object-fit:cover}
.galeria header .t{flex:1;min-width:0}
.galeria header b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.galeria header small{opacity:.75;font-size:12px}
.galeria header button{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:16px;display:grid;place-items:center}
.trilho{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.trilho::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;height:100%;scroll-snap-align:center;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;position:relative}
.slide img,.slide video{max-width:100%;max-height:100%;object-fit:contain;-webkit-user-drag:none;pointer-events:auto}
.slide img{pointer-events:none}
.slide .carregando{position:absolute;inset:0;display:grid;place-items:center}
.slide .carregando.preparo{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.slide .carregando.preparo small{color:rgba(255,255,255,.75);font-size:13px}
.slide .carregando i{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.18);border-top-color:#fff;animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.slide .grande{color:#fff;text-align:center;padding:24px;display:grid;gap:12px;justify-items:center}
.slide .grande .ico{font-size:46px}
.galeria footer{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:22px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(0deg,rgba(0,0,0,.7),transparent);display:flex;flex-direction:column;align-items:center;gap:10px}
.pontos{display:flex;gap:6px;max-width:100%;overflow:hidden}
.pontos i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.35);transition:.2s;flex:none}
.pontos i.on{background:#fff;width:18px;border-radius:4px}
.contador{position:absolute;top:calc(64px + env(safe-area-inset-top));right:14px;z-index:2;background:rgba(0,0,0,.55);color:#fff;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px}
.seta-g{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font-size:22px;display:none;place-items:center}
@media (hover:hover){.seta-g{display:grid}}
.seta-g.esq{left:12px}.seta-g.dir{right:12px}
.galeria .rodape-g{display:flex;gap:8px}
.galeria .rodape-g .btn{width:auto;padding:10px 16px;font-size:13.5px}

/* ── Movimento e interação ───────────────────────────────────────────── */
main{overflow-x:clip}
@keyframes entra{from{opacity:0;transform:translateY(16px) scale(.985)}}
.anima .entra,.anima.entra-raiz .entra{animation:entra .55s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0) * 45ms)}
@keyframes vem-dir{from{opacity:0;transform:translateX(28px)}}
@keyframes vem-esq{from{opacity:0;transform:translateX(-28px)}}
#conteudo.vai-dir{animation:vem-dir .38s cubic-bezier(.2,.8,.2,1)}
#conteudo.vai-esq{animation:vem-esq .38s cubic-bezier(.2,.8,.2,1)}
.acao,.kpi,.plano,.chip,.mimo,.item,.card,.cta-vip,.vip-ativo,.ranking .linha,.interacao,.preco-tag,.seg button,.btn,.beneficio{transition:transform .2s cubic-bezier(.2,.8,.2,1),background .25s,border-color .25s,box-shadow .25s,color .25s}
.acao:active,.kpi:active,.plano:active,.chip:active,.item:active,.card:active,.cta-vip:active,.vip-ativo:active,.ranking .linha:active,.preco-tag:active,.beneficio:active{transform:scale(.97)}
.btn:active{transform:scale(.97)}
img.fade{opacity:0;transition:opacity .55s ease,transform .6s}
img.fade.ok{opacity:1}
/* avatar com anel de stories girando */
@property --ang{syntax:"<angle>";inherits:false;initial-value:0deg}
.anel{position:relative;padding:3px;border-radius:50%;background:conic-gradient(from var(--ang),#ff2e7e,#ff7a3d,#ffd23d,#7b5cff,#ff2e7e);animation:anel 5s linear infinite;box-shadow:0 12px 36px color-mix(in srgb,var(--a1) 30%,transparent)}
@keyframes anel{to{--ang:360deg}}
.anel .avatar{box-shadow:none}
.avatar-wrap .lapis{z-index:2;transition:transform .2s}
.avatar-wrap:active .lapis{transform:scale(.85) rotate(-12deg)}
/* gradiente vivo e brilho passando */
.vivo{background:linear-gradient(120deg,var(--a1),var(--a2),#ff4fa3,#7b5cff,var(--a1)) !important;background-size:400% 400% !important;animation:grad 14s ease infinite}
@keyframes grad{50%{background-position:100% 50%}}
.brilho{position:relative;overflow:hidden;isolation:isolate}
.brilho::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.38) 50%,transparent 65%);transform:translateX(-120%);animation:brilho 3.6s ease-in-out infinite;pointer-events:none}
.desbloq.brilho::after{background:linear-gradient(110deg,transparent 35%,color-mix(in srgb,var(--a1) 28%,transparent) 50%,transparent 65%);z-index:0}
@keyframes brilho{55%,100%{transform:translateX(120%)}}
.cadeado{animation:respira 2.8s ease-in-out infinite}
@keyframes respira{50%{transform:scale(1.07)}}
.midia .veu .desbloq{transition:transform .25s}
.midia:active .veu .desbloq{transform:scale(.95)}
/* barra inferior com pílula deslizante */
.barra nav{position:relative}
.barra nav .pilula{position:absolute;top:6px;bottom:6px;left:6px;border-radius:16px;background:color-mix(in srgb,var(--text) 9%,transparent);transition:transform .45s cubic-bezier(.3,1.25,.5,1);pointer-events:none}
.barra nav button{position:relative;z-index:1}
.barra nav button.on{background:transparent}
.barra nav button.salta .ico{animation:pula .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pula{40%{transform:translateY(-6px) scale(1.22)}}
/* topo fixo que aparece ao rolar */
.topo-fixo{position:fixed;top:0;left:0;right:0;z-index:9;display:flex;align-items:center;gap:10px;padding:10px 16px;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);border-bottom:1px solid var(--line);transform:translateY(-110%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.rolou .topo-fixo{transform:none}
.rolou #volta-criadora{opacity:0;pointer-events:none}
#volta-criadora{transition:opacity .2s}
.topo-fixo .av{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--grad);display:grid;place-items:center;color:#fff;font-size:14px;flex:none}
.topo-fixo b{font-size:15px;display:flex;align-items:center;gap:5px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topo-fixo .verif{width:16px;height:16px;font-size:10px;flex:none}
.topo-fixo .btn{margin-left:auto;flex:none}
/* curtida: coração gigante no toque duplo + faíscas */
.foto-wrap{position:relative}
.coracao-grande{position:absolute;left:50%;top:50%;line-height:0;transform:translate(-50%,-50%) scale(0);z-index:3;pointer-events:none;filter:drop-shadow(0 10px 30px rgba(255,46,126,.55));animation:coracao 1s cubic-bezier(.2,1.3,.4,1) forwards}
@keyframes coracao{15%{transform:translate(-50%,-50%) scale(1.25)}30%{transform:translate(-50%,-50%) scale(.92)}45%,70%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-110%) scale(.55);opacity:0}}
.faisca{position:absolute;left:24px;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;pointer-events:none;animation:faisca .65s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes faisca{to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}
/* confete e emoji voando */
.confete{position:fixed;top:-14px;z-index:80;width:8px;height:13px;border-radius:2px;pointer-events:none;animation:cai var(--d,2s) cubic-bezier(.25,.6,.4,1) forwards}
@keyframes cai{to{transform:translate(var(--x),108vh) rotate(var(--r))}}
.emoji-voa{position:fixed;z-index:80;font-size:34px;pointer-events:none;animation:voa 1.1s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes voa{to{transform:translate(var(--x),-220px) scale(1.6) rotate(var(--r));opacity:0}}
/* folha: sai deslizando e pode ser arrastada para baixo */
.fundo.saindo{animation:some .22s forwards}
.fundo.saindo .folha{animation:desce .22s forwards}
@keyframes some{to{opacity:0}}
@keyframes desce{to{transform:translateY(40%)}}
.folha .alca{cursor:grab;touch-action:none}
/* painel */
.ola{margin:6px 16px 0;border-radius:var(--r);padding:18px 18px 16px;color:#fff;position:relative;overflow:hidden;box-shadow:0 16px 40px color-mix(in srgb,var(--a1) 30%,transparent)}
.ola small{opacity:.92;font-size:13px;font-weight:700}
.ola b{display:block;font-size:30px;letter-spacing:-.03em;margin:2px 0 2px;font-variant-numeric:tabular-nums}
.ola span{opacity:.92;font-size:13px}
.ola .deco{position:absolute;right:16px;top:12px;font-size:44px;opacity:.3;animation:respira 3s ease-in-out infinite}
.kpi b{font-variant-numeric:tabular-nums}
.grafico .col{transform-origin:bottom;animation:cresce .8s cubic-bezier(.2,.9,.3,1) backwards;animation-delay:calc(var(--i,0) * 35ms);cursor:pointer;transition:filter .2s}
.grafico .col.sel{filter:brightness(1.35)}
.grafico .col.sel::after{content:attr(data-v);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);font-size:11px;font-weight:700;padding:4px 8px;border-radius:8px;white-space:nowrap;z-index:2}
.grafico .col:first-child.sel::after,.grafico .col:nth-child(2).sel::after{left:0;transform:none}
.grafico .col:last-child.sel::after,.grafico .col:nth-last-child(2).sel::after{left:auto;right:0;transform:none}
@keyframes cresce{from{transform:scaleY(0)}}
.divisao span{transform-origin:left;animation:cresce-x .9s cubic-bezier(.2,.9,.3,1) backwards}
@keyframes cresce-x{from{transform:scaleX(0)}}
.seg button{transition:background .3s,color .3s,transform .2s}
.fab{animation:fab-in .5s cubic-bezier(.3,1.5,.5,1) backwards}
.fab:active{transform:scale(.9) rotate(90deg)}
@keyframes fab-in{from{transform:scale(0) rotate(-90deg)}}
.plano.on .radio::after{animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.legenda.mais{cursor:pointer;position:relative}
.legenda.mais{padding-bottom:0;margin-bottom:6px}
.ver-mais{color:var(--muted);font-weight:700;font-size:13.5px;padding:0 14px 12px;display:block;cursor:pointer}
.chave::after{transition:transform .3s cubic-bezier(.3,1.4,.5,1)}
#pub-pagos.abre{animation:entra .4s cubic-bezier(.2,.8,.2,1)}

/* ── Editor de fotos ─────────────────────────────────────────────────── */
.ed{position:fixed;inset:0;z-index:60;background:#000;color:#fff;display:flex;flex-direction:column;animation:surge .2s;-webkit-user-select:none;user-select:none}
.ed header{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 12px 10px}
.ed header b{font-size:15px}
.ed header button{padding:8px 12px;border-radius:12px;font-weight:700;font-size:15px}
.ed header .pronto{background:var(--grad);color:#fff}
.palco{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;touch-action:none;margin:0 12px}
.palco canvas{display:block;max-width:100%;max-height:100%}
.recorte{position:absolute;box-shadow:0 0 0 9999px rgba(0,0,0,.6);border:1.5px solid #fff;touch-action:none;cursor:move}
.recorte.circulo{border-radius:50%}
.recorte::before,.recorte::after{content:"";position:absolute;inset:0;pointer-events:none;border:0 solid rgba(255,255,255,.35)}
.recorte::before{left:33.33%;right:33.33%;border-left-width:1px;border-right-width:1px}
.recorte::after{top:33.33%;bottom:33.33%;border-top-width:1px;border-bottom-width:1px}
.recorte .h{position:absolute;width:26px;height:26px;border:3.5px solid #fff;touch-action:none}
.recorte .tl{left:-4px;top:-4px;border-right:0;border-bottom:0;cursor:nwse-resize}
.recorte .tr{right:-4px;top:-4px;border-left:0;border-bottom:0;cursor:nesw-resize}
.recorte .bl{left:-4px;bottom:-4px;border-right:0;border-top:0;cursor:nesw-resize}
.recorte .br{right:-4px;bottom:-4px;border-left:0;border-top:0;cursor:nwse-resize}
.ed .painel-ed{padding:12px 12px calc(12px + env(safe-area-inset-bottom));display:grid;grid-template-columns:minmax(0,1fr);gap:12px;min-height:150px}
.ed .abas-ed{display:flex;justify-content:center;gap:6px}
.ed .abas-ed button{padding:7px 14px;border-radius:999px;font-size:13.5px;font-weight:700;color:rgba(255,255,255,.6)}
.ed .abas-ed button.on{background:rgba(255,255,255,.14);color:#fff}
.ed .linha-ed{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.ed .linha-ed>:first-child{margin-left:auto}.ed .linha-ed>:last-child{margin-right:auto}
.ed .linha-ed::-webkit-scrollbar{display:none}
.ed .bt-ed{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 10px;border-radius:14px;font-size:12px;font-weight:600;color:rgba(255,255,255,.75);min-width:58px;transition:background .2s,transform .15s}
.ed .bt-ed:active{transform:scale(.93)}
.ed .bt-ed .i{font-size:20px;line-height:1}
.ed .bt-ed.on{background:rgba(255,255,255,.14);color:#fff}
.ed .filtro img{width:58px;height:58px;border-radius:12px;object-fit:cover;border:2px solid transparent}
.ed .filtro.on img{border-color:var(--a1)}
.ed .ajuste{display:grid;grid-template-columns:86px 1fr 40px;align-items:center;gap:10px;font-size:13px;color:rgba(255,255,255,.8)}
.ed .ajuste span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.ed input[type=range]{width:100%;accent-color:var(--a1)}
.ed .salvando{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.55);z-index:3}
.miniaturas .lapis-m{position:absolute;bottom:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.92);color:#111;font-size:12px;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.3)}

/* ── Fila de revisão ─────────────────────────────────────────────────── */
.contador-fila{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:var(--grad);color:#fff;font-size:12px;font-weight:800;margin-left:8px;vertical-align:middle}
.fila{display:grid;gap:10px;padding:0 16px}
.fila-item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;position:relative}
.fila-item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--warn)}
.fila-item .topo-f{display:flex;gap:12px;padding:12px 14px 10px 16px;cursor:pointer}
.fila-item img,.fila-item .thumb{width:64px;height:64px;border-radius:14px;object-fit:cover;flex:none;background:color-mix(in srgb,var(--a1) 14%,transparent);display:grid;place-items:center;font-size:26px}
.fila-item .txt{flex:1;min-width:0}
.fila-item small{color:var(--muted);font-size:12px;font-weight:600}
.fila-item b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.fila-item p{margin:2px 0 0;color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fila-item .acoes-f{display:flex;gap:8px;padding:0 14px 12px 16px}
.fila-item .acoes-f .btn{flex:1}
.fila-item .acoes-f .btn.sec{flex:none;width:44px;padding:9px 0}
.fila-item.some{animation:fila-sai .35s cubic-bezier(.4,0,.2,1) forwards}
@keyframes fila-sai{to{opacity:0;transform:translateX(60px) scale(.96)}}
.aviso-fila{display:flex;align-items:center;gap:10px;margin:0 16px 12px;padding:12px 14px;border-radius:var(--rs);background:color-mix(in srgb,var(--warn) 13%,var(--card));border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);font-size:13.5px;font-weight:600;cursor:pointer}
.aviso-fila span:last-child{margin-left:auto;color:var(--muted)}
.barra nav .bolinha{position:absolute;top:4px;right:calc(50% - 22px);min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--a1);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;box-shadow:0 0 0 2px var(--bg2);animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
.previa-fa{pointer-events:none;margin:6px -2px 10px}
.previa-fa .post{box-shadow:none}

/* ── Aba Ajustes ─────────────────────────────────────────────────────── */
.grupo{margin:0 16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.grupo .linha-c{display:flex;align-items:center;gap:12px;padding:13px 14px;border-top:1px solid var(--line);width:100%;text-align:left;transition:background .2s}
.grupo .linha-c:first-child{border-top:0}
.grupo .linha-c:active{background:color-mix(in srgb,var(--text) 6%,transparent)}
.grupo .linha-c .ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:17px;flex:none;background:color-mix(in srgb,var(--a1) 13%,transparent)}
.grupo .linha-c .txt{flex:1;min-width:0}
.grupo .linha-c b{display:block;font-size:14.5px}
.grupo .linha-c small{display:block;color:var(--muted);font-size:12.5px}
.grupo .linha-c .v{font-weight:800;font-size:14.5px;white-space:nowrap}
.grupo .linha-c .seta{color:var(--muted);font-size:18px}
.grupo .linha-c.add{color:var(--a1);font-weight:700;justify-content:center}
.grupo .vazio-c{padding:14px;color:var(--muted);font-size:13.5px;text-align:center}
.legenda-grupo{padding:8px 20px 0;color:var(--muted);font-size:12.5px}
.chips-valor{display:flex;flex-wrap:wrap;gap:6px}
.chips-valor span{background:color-mix(in srgb,var(--a1) 12%,transparent);color:var(--text);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:700}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opcoes{display:flex;gap:6px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.opcoes button{flex:1;height:38px;border-radius:10px;font-weight:700;color:var(--muted);transition:.25s}
.opcoes button.on{background:var(--text);color:var(--bg)}
/* ── VIP: renovação e promo ──────────────────────────────────────────── */
.vip-ativo.urgente{border-color:color-mix(in srgb,var(--warn) 55%,transparent);background:color-mix(in srgb,var(--warn) 10%,var(--card))}
.vip-ativo .btn.mini{flex:none}
.renovar{margin:0 16px 14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.renovar .topo-r{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted)}
.renovar .topo-r b{color:var(--text);font-size:15px}
.renovar .btn{margin-top:12px}
.plano .valor s{display:block;color:var(--muted);font-size:12px;font-weight:600}
.eco.promo{background:color-mix(in srgb,var(--a1) 16%,transparent);color:var(--a1)}
/* ── Ficha do fã / bloqueados ────────────────────────────────────────── */
.ficha{display:flex;align-items:center;gap:14px;margin:4px 0 14px}
.ficha .av-fa{width:56px;height:56px;border-radius:50%;background:var(--grad);display:grid;place-items:center;color:#fff;font-size:24px;font-weight:800;flex:none}
.ficha b{display:block;font-size:17px}
.ficha small{color:var(--muted)}
.selo-bloq{display:inline-block;background:color-mix(in srgb,var(--err) 15%,transparent);color:var(--err);font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;margin-top:4px}
.bloqueado-tela{min-height:80vh;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted)}
/* ── Enquetes ─────────────────────────────────────────────────────────── */
.enquete{display:grid;gap:8px;padding:0 14px 12px}
.enquete .opc{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;padding:10px 14px;border-radius:14px;border:1.5px solid var(--line);background:transparent;font-weight:700;font-size:14.5px;text-align:left;overflow:hidden;width:100%}
.enquete button.opc{transition:transform .15s,border-color .2s}
.enquete button.opc:active{transform:scale(.98);border-color:var(--a1)}
.enquete .opc i{position:absolute;left:0;top:0;bottom:0;background:color-mix(in srgb,var(--text) 8%,transparent);border-radius:12px 0 0 12px;transform-origin:left;animation:cresce-x .7s cubic-bezier(.2,.9,.3,1) backwards}
.enquete .opc.meu{border-color:var(--a1)}
.enquete .opc.meu i{background:color-mix(in srgb,var(--a1) 22%,transparent)}
.enquete .opc span,.enquete .opc b{position:relative}
.enquete .opc b{font-variant-numeric:tabular-nums}
.enquete small{font-size:12.5px}
.ed-enq{display:grid;gap:8px;margin-top:10px}
/* ── Lançamentos e agendados ──────────────────────────────────────────── */
.lancamento .midia img{filter:saturate(1.2)}
.lancamento .veu{background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.6))}
.selo-lanc{background:var(--grad);color:#fff;font-weight:800;font-size:12.5px;padding:6px 12px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.relogio{display:flex;gap:8px;font-variant-numeric:tabular-nums}
.relogio div{min-width:58px;padding:8px 6px;border-radius:14px;background:rgba(255,255,255,.14);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.25);text-align:center}
.relogio b{display:block;font-size:24px;font-weight:900;letter-spacing:-.02em;line-height:1.1}
.relogio small{font-size:10.5px;opacity:.85;text-transform:uppercase;letter-spacing:.06em}
.lancamento .quando{font-size:13px;opacity:.9;font-weight:600}
.btn-aviso{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;font-weight:800;font-size:13.5px;background:var(--grad);color:#fff;white-space:nowrap}
.btn-aviso.on{background:var(--card);color:var(--ok);border:1px solid var(--line)}
.btn-aviso .sino{display:inline-block}
.btn-aviso:not(.on) .sino{animation:sino 2.4s ease-in-out infinite;transform-origin:50% 0}
@keyframes sino{0%,60%,100%{transform:rotate(0)}10%{transform:rotate(16deg)}20%{transform:rotate(-14deg)}30%{transform:rotate(9deg)}40%{transform:rotate(-6deg)}}
.ag-item::before{background:#7b5cff !important}
.ag-item .quando-ag{color:#7b5cff;font-weight:800}
input[type=datetime-local]{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--text);font:15px inherit;font-family:inherit;outline:none;color-scheme:dark light;min-height:48px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}}

/* ── Stories ───────────────────────────────────────────────────────────── */
.anel.story{cursor:pointer;animation-duration:2.6s}
.anel.story::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid color-mix(in srgb,var(--a1) 60%,transparent);animation:story-pulso 2.2s ease-out infinite;pointer-events:none}
@keyframes story-pulso{from{transform:scale(.93);opacity:1}to{transform:scale(1.13);opacity:0}}
.anel.story.visto{background:color-mix(in srgb,var(--muted) 60%,transparent);animation:none;box-shadow:none}
.anel.story.visto::after{display:none}
.selo-story{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);z-index:3;background:var(--grad);color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.05em;padding:2px 9px;border-radius:999px;border:2px solid var(--bg);white-space:nowrap;pointer-events:none}
.selo-story.cinza{background:var(--card);color:var(--muted);border-color:var(--bg)}
.stories{position:fixed;inset:0;z-index:60;background:#000;color:#fff;animation:surge .2s;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.stories .barras{position:absolute;top:calc(8px + env(safe-area-inset-top));left:10px;right:10px;z-index:4;display:flex;gap:4px}
.stories .barras span{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.32);overflow:hidden}
.stories .barras i{display:block;height:100%;width:0;background:#fff}
.stories .cab-s{position:absolute;top:calc(16px + env(safe-area-inset-top));left:0;right:0;z-index:4;display:flex;align-items:center;gap:10px;padding:8px 12px 22px;background:linear-gradient(180deg,rgba(0,0,0,.55),transparent)}
.stories .cab-s .av{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--grad);display:grid;place-items:center;font-size:14px;flex:none}
.stories .cab-s b{font-size:14px}
.stories .cab-s small{opacity:.75;font-size:12px;margin-left:6px}
.stories .cab-s .acoes-s{margin-left:auto;display:flex;gap:8px}
.stories .cab-s button{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;font-size:15px}
.stories .palco{position:absolute;inset:0;display:grid;place-items:center}
.stories .palco img,.stories .palco video{width:100%;height:100%;object-fit:contain;-webkit-user-drag:none}
.stories .zona{position:absolute;top:70px;bottom:90px;z-index:3}
.stories .zona.esq{left:0;width:33%}
.stories .zona.dir{right:0;width:67%}
.stories .legenda-s{position:absolute;left:16px;right:16px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:4;text-align:center;font-size:15.5px;font-weight:600;line-height:1.35;text-shadow:0 1px 10px rgba(0,0,0,.85);pointer-events:none}
.stories .rodape-s{position:absolute;left:0;right:0;bottom:0;z-index:4;display:flex;gap:8px;justify-content:center;padding:22px 16px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(0deg,rgba(0,0,0,.65),transparent)}
.stories .rodape-s .btn{width:auto;padding:10px 16px;font-size:13.5px}
.stories .rodape-s .btn.sec{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.2)}
.stories .carregando-s{position:absolute;inset:0;display:grid;place-items:center;z-index:1}
.stories .carregando-s i{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;animation:gira .8s linear infinite}
.stories.pausado .barras{opacity:.35;transition:opacity .2s}

/* ── Conteúdo só para VIP ──────────────────────────────────────────────── */
.bloqueio-vip{padding:24px 18px;border-radius:var(--r);background:var(--card);border:1.5px dashed color-mix(in srgb,var(--a1) 45%,transparent);text-align:center}
.bloqueio-vip .ico{font-size:36px;line-height:1}
.bloqueio-vip b{display:block;font-size:16.5px;margin-top:8px}
.bloqueio-vip p{color:var(--muted);margin:6px auto 14px;font-size:14px;max-width:320px}
.bloqueio-vip .btn{width:auto;margin:0 auto;padding:12px 22px}
.bloqueio-vip.tela{padding:30px 20px 24px;margin-top:6px}
.bloqueio-vip.tela .ico{width:64px;height:64px;margin:0 auto;border-radius:50%;display:grid;place-items:center;background:var(--grad);color:#fff}
.bloqueio-vip.tela .ico svg{width:30px;height:30px}
.bloqueio-vip.tela b{font-size:18px;margin-top:14px}
.bloq-lista{list-style:none;margin:4px auto 18px;padding:0;display:grid;gap:8px;max-width:260px;text-align:left}
.bloq-lista li{display:flex;align-items:center;gap:10px;font-size:14.5px;font-weight:600}
.bloq-lista .li-ico{width:30px;height:30px;border-radius:10px;flex:none;display:grid;place-items:center;background:color-mix(in srgb,var(--a1) 14%,transparent);color:var(--a1)}
.bloq-lista .li-ico svg{width:17px;height:17px}
.bloqueio-vip.tela .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;max-width:300px}
.bloqueio-vip.tela .btn + .btn{margin-top:10px}

/* ── Meta de mimos ─────────────────────────────────────────────────────── */
.meta{margin:0 16px 14px;padding:14px 16px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);cursor:pointer}
.meta .topo-m{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.meta .topo-m b{font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta .topo-m span{font-weight:800;font-size:14px;flex:none}
.meta .barra-prog{height:8px;margin-top:10px}
.meta .barra-prog i{transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.meta small{display:block;color:var(--muted);font-size:12.5px;margin-top:8px}
.meta p{margin:6px 0 0;color:var(--muted);font-size:13.5px}
.meta.batida{border-color:color-mix(in srgb,var(--ok) 45%,transparent);background:color-mix(in srgb,var(--ok) 7%,var(--card))}
.meta.batida .barra-prog i{background:var(--ok)}
.feed .meta{margin:0}

/* ── Carrinho ──────────────────────────────────────────────────────────── */
.post .rodape .acoes-r{display:flex;align-items:center;gap:8px;flex:none}
.btn-cart{width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:16px;flex:none;transition:transform .2s,background .25s,border-color .25s}
.btn-cart:active{transform:scale(.9)}
.btn-cart.on{background:color-mix(in srgb,var(--ok) 18%,var(--card));border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.carrinho-bar{position:fixed;left:50%;bottom:calc(var(--nav-h) + 22px + env(safe-area-inset-bottom));z-index:10;transform:translateX(-50%);width:calc(100% - 32px);max-width:528px;display:flex;align-items:center;gap:12px;padding:9px 9px 9px 16px;border-radius:18px;background:var(--text);color:var(--bg);box-shadow:var(--sombra);cursor:pointer;animation:cart-in .35s cubic-bezier(.2,1.2,.4,1)}
@keyframes cart-in{from{opacity:0;transform:translate(-50%,16px)}}
.carrinho-bar .ico{font-size:20px}
.carrinho-bar b{display:block;font-size:14.5px}
.carrinho-bar small{opacity:.7;font-size:12px}
.carrinho-bar .btn{margin-left:auto;width:auto;padding:10px 16px;font-size:14px}
body.tem-carrinho main{padding-bottom:calc(var(--nav-h) + 96px + env(safe-area-inset-bottom))}
body.tem-carrinho .toast{bottom:calc(var(--nav-h) + 92px)}
.linha-total{display:flex;justify-content:space-between;align-items:center;padding:6px 2px;font-size:14px;color:var(--muted)}
.linha-total.desc{color:var(--ok);font-weight:700}
.linha-total.final{color:var(--text);font-size:17px;font-weight:800;border-top:1px solid var(--line);margin-top:6px;padding-top:12px}

/* ── Busca e filtros ───────────────────────────────────────────────────── */
.busca{display:flex;gap:8px;padding:0 16px 12px}
.busca .campo-b{flex:1;position:relative;min-width:0}
.busca .campo-b input{padding:11px 36px 11px 38px}
.busca .lupa{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.55;pointer-events:none;font-size:15px}
.busca .limpar{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;color:var(--muted);font-size:13px}
.btn-filtros{flex:none;position:relative;padding:0 14px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);font-weight:700;font-size:13.5px;color:var(--text)}
.btn-filtros .n{position:absolute;top:-7px;right:-7px;background:var(--grad);color:#fff;font-size:11px;font-weight:800;min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;padding:0 5px}
.resultado-busca{display:flex;justify-content:space-between;align-items:center;padding:0 18px 10px;color:var(--muted);font-size:13px}
.resultado-busca button{color:var(--a1);font-weight:700;font-size:13px}
.grupo-filtro{margin-top:14px}
.grupo-filtro .opcoes{display:flex;flex-wrap:wrap;gap:8px;padding:0;background:none;border:0}
.grupo-filtro .opcoes button{flex:none;padding:9px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.grupo-filtro .opcoes button.on{background:var(--text);color:var(--bg);border-color:transparent}

/* ── Pedidos personalizados ────────────────────────────────────────────── */
.st{display:inline-block;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}
.st.novo{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.st.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.st.rec{background:color-mix(in srgb,var(--err) 15%,transparent);color:var(--err)}
.card-pedido{margin:16px;padding:18px;border-radius:var(--r);background:var(--card);border:1px solid var(--line)}
.card-pedido h2{font-size:18px}
.card-pedido p{color:var(--muted);font-size:14px;margin:6px 0 0}
.card-pedido .detalhes-p{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 14px}
.card-pedido .detalhes-p span{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600}
.texto-pedido{background:var(--card);border:1px solid var(--line);border-radius:var(--rs);padding:12px 14px;white-space:pre-wrap;word-break:break-word;font-size:14.5px;margin:10px 0}
.lista{grid-template-columns:minmax(0,1fr)}
.lista .item .st{margin-top:4px}
.lista .item small.lim{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── Ranking de fãs ────────────────────────────────────────────────────── */
.ranking .av-r{width:42px;height:42px;border-radius:50%;background:var(--grad);display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px;flex:none}
.ranking .pos.medalha{font-size:19px}
.selo-rank{margin:16px 16px 0;padding:14px 16px;border-radius:var(--r);display:flex;align-items:center;gap:12px;background:linear-gradient(120deg,color-mix(in srgb,#ffd23d 22%,var(--card)),var(--card));border:1px solid color-mix(in srgb,#ffd23d 40%,transparent)}
.selo-rank .ico{font-size:28px}
.selo-rank b{display:block}
.selo-rank small{color:var(--muted)}

/* ── Ícones SVG ──────────────────────────────────────────────────────── */
:root{--estrela:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='black' d='M12 2.6l2.9 5.88 6.5.94-4.7 4.58 1.11 6.47L12 17.42l-5.81 3.05 1.11-6.47-4.7-4.58 6.5-.94z'/%3E%3C/svg%3E")}
svg.i{width:1.15em;height:1.15em;display:inline-block;vertical-align:-.22em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none;overflow:visible}
svg.i.ouro{color:#f5b301}
svg.i.rosa{color:var(--a1)}
svg.i.verde{color:#2fbf71}
svg.i.laranja{color:#ff8a3d}
.btn svg.i,.chip svg.i,.toast svg.i{margin-right:2px}
.acao .ico,.linha-c .ico,.beneficio .ico,.vazio .ico,.ok-grande .emoji,.mimo .emoji,.bloqueio-vip .ico{color:var(--a1)}
.vazio .ico svg.i,.ok-grande .emoji svg.i,.slide .grande .ico svg.i{stroke-width:1.5}
.mimo .emoji svg.i{stroke-width:1.7}
.emoji-voa{color:var(--a1)}
.emoji-voa svg.i{display:block}
.slide .grande .ico{color:#fff}
.verif svg.i{width:.9em;height:.9em;vertical-align:-.1em;stroke-width:3}
.check svg.i{stroke-width:2.6}

/* ── Recursos (Ajustes) ───────────────────────────────────────────────── */
.status-rec{font-size:11.5px;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--line);color:var(--muted);flex:none}
.status-rec.on{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.campo-rec{margin-top:12px}
.campo-rec.oculto{display:none}
.campo-rec .linha-bool{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.campo-rec .linha-bool b{font-size:14.5px}
.campo-rec .ajuda{display:block;color:var(--muted);font-size:12.5px;margin-top:5px}
.campo-rec .com-sufixo{position:relative}
.campo-rec .com-sufixo span{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:700;pointer-events:none}
.grupo-filtro.rec .opcoes{display:flex;flex-wrap:wrap;gap:8px}
.cores-tema{display:flex;gap:10px;flex-wrap:wrap}
.cores-tema button{width:40px;height:40px;border-radius:50%;border:3px solid transparent;transition:.2s}
.cores-tema button.on{border-color:var(--text);transform:scale(1.08)}

/* ── Melhorias opcionais ─────────────────────────────────────────────── */
:root[data-tema-modo="escuro"]{--bg:#0b0d12;--bg2:#141821;--text:#f4f5f8;--muted:#8b93a3}
:root[data-tema-modo="claro"]{--bg:#ffffff;--bg2:#f3f4f8;--text:#16181f;--muted:#6b7280;--card:#f6f7fa;--sombra:0 8px 24px rgba(20,22,30,.08)}
.cards-extra{display:grid;gap:10px;padding:0 16px 14px}
.card-extra{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r);background:var(--card);border:1px solid var(--line)}
.card-extra .ico{width:44px;height:44px;border-radius:14px;background:var(--grad);display:grid;place-items:center;color:#fff;font-size:20px;flex:none}
.card-extra img{width:56px;height:56px;border-radius:14px;object-fit:cover;flex:none}
.card-extra small{display:block;color:var(--muted);font-size:12px}
.card-extra b{display:block}
.card-extra span{font-size:13px;color:var(--muted)}
.card-extra > div > span{display:block}
.card-extra span b,.card-extra span s{display:inline}
.card-extra .seta{font-size:20px;margin-left:auto}
.card-extra.upsell{cursor:pointer;background:linear-gradient(120deg,color-mix(in srgb,var(--a1) 16%,var(--card)),var(--card))}
.card-extra.carteira,.card-extra.nivel{margin:16px 16px 0}
.card-extra .saldo{font-size:22px;letter-spacing:-.02em}
.card-extra .col-bts{display:grid;gap:6px;flex:none}
.card-extra .col-bts .btn{padding:8px 12px}
.card-extra .barra-prog{margin:6px 0 4px}
.chips.colecoes .chip.on{background:var(--grad);color:#fff}
.tag-relampago{position:absolute;left:10px;top:10px;z-index:2;background:linear-gradient(135deg,#ffb800,#ff5a1f);color:#fff;font-size:12px;font-weight:800;padding:5px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:4px;box-shadow:0 6px 18px rgba(255,90,31,.4)}
.preco-tag.promo s{opacity:.65;font-weight:600;margin-right:2px}
.nota-pack{display:inline-flex;align-items:center;gap:3px;color:#f5b301;font-weight:700;margin-left:6px}
.nota-pack small{color:var(--muted);font-weight:500}
.midia video.teaser{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;pointer-events:none}
.avaliar{display:flex;align-items:center;justify-content:space-between;padding:0 14px 6px;color:var(--muted);font-size:13px}
.avaliar span{display:flex;gap:2px}
.avaliar button{font-size:20px;color:var(--muted);padding:2px}
.avaliar button.on{color:#f5b301}
.comentarios{display:grid;gap:10px;max-height:52vh;overflow:auto;margin:6px 0 4px}
.coment{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.coment.dela{border-color:color-mix(in srgb,var(--a1) 40%,transparent)}
.coment p{margin:3px 0;white-space:pre-wrap;word-break:break-word}
.coment small,.coment-mod small{color:var(--muted);font-size:12px}
.coment small a{color:var(--err);cursor:pointer}
.coment-mod{background:var(--card);border:1px solid var(--line);border-radius:var(--rs);padding:12px 14px;margin-top:10px}
.coment-mod.apagado{opacity:.55}
.coment-mod b{display:block}
.coment-mod p{margin:4px 0;color:var(--text);font-size:14px;white-space:pre-wrap;word-break:break-word}
.coment-mod .bts{display:flex;gap:8px;margin-top:8px}
.coment-mod .bts .btn{width:auto;flex:1}
.coment-mod .metricas{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:13px}
.coment-mod .metricas b{display:inline;color:var(--text)}
.folha .campo{padding:10px 0 0}
.teste-vip{background:linear-gradient(120deg,color-mix(in srgb,var(--a1) 14%,var(--card)),var(--card))}

.aj-topo{position:sticky;top:58px;z-index:5;background:var(--bg);padding:12px 0 2px;margin-top:4px}
.aj-chips{padding-bottom:8px;gap:6px}
.aj-chips .chip{padding:8px 12px}
.aj-painel .secao-titulo{padding:16px 16px 8px}
.aj-painel .secao-titulo h2{font-size:15px}
.aj-painel .legenda-grupo{font-size:12px;padding:6px 20px 0}
.grupo .linha-c{padding:11px 14px}
.rec-sec .linha-c:not(.rec-cab){display:none}
.rec-sec.aberta .linha-c:not(.rec-cab){display:flex}
.rec-sec .linha-c.ocultar{display:none !important}
.rec-cab .seta{font-size:13px;color:var(--muted)}
</style>
</head>

function enviarForm(caminho, campos, arquivos = [], aoProgresso){
  return new Promise(res => {
    const fd = new FormData();
    Object.entries(campos).forEach(([k, v]) => fd.append(k, v ?? ""));
    arquivos.forEach(([nome, f]) => fd.append(nome, f, f.name || "arquivo"));
    const x = new XMLHttpRequest();
    x.open("POST", caminho);
    x.setRequestHeader("X-Telegram-Init-Data", INIT); x.setRequestHeader("X-Requested-With", "painel");
    x.upload.onprogress = e => e.lengthComputable && aoProgresso?.(e.loaded / e.total);
    x.onload = () => { let j = {}; try{ j = JSON.parse(x.responseText) }catch(e){} res({ok: x.status < 300, status: x.status, ...j}) };
    x.onerror = () => res({ok:false, erro:"Sem conexão. Tente de novo."});
    x.send(fd);
  });
}

function comIcones(t){

  for(const nome of Object.keys(ICONES)) for(const cls of [undefined, "ouro", "rosa", "verde", "laranja"]){

}

// Números sobem do zero (R$ 1.234,56 · 12 · 35%)
function contar(raiz){
  if(!raiz || SEM_MOVIMENTO) return;
  raiz.querySelectorAll(".kpi b,.stats b,.grafico .topo b,.ola b").forEach(el => {
    const t = el.textContent.trim(), m = t.match(/^(R\$\s)?([\d.]+)(,(\d+))?(%?)$/);
    if(!m) return;
    const alvo = parseFloat(m[2].replace(/\./g, "") + "." + (m[4] || "0")), dec = m[4] ? m[4].length : 0;
    if(!alvo) return;
    const fmt = v => (m[1] || "") + v.toLocaleString("pt-BR", {minimumFractionDigits: dec, maximumFractionDigits: dec}) + m[5];
    const ini = performance.now(), dur = 900;
    const passo = agora => { const p = Math.min(1, (agora - ini) / dur); el.textContent = fmt(alvo * (1 - Math.pow(1 - p, 3))); if(p < 1) requestAnimationFrame(passo); else el.textContent = t };
    requestAnimationFrame(passo);
  });
}

  if(r.erro === "bloqueado"){ $("#barra").innerHTML = ""; $("#app").innerHTML = `<div class="bloqueado-tela"><div><div style="font-size:48px">${ic("bloqueio")}</div><h2 style="color:var(--text);margin:8px 0 6px">Acesso indisponível</h2>Seu acesso a este perfil foi bloqueado.</div></div>`; return }
  if(!r.ok){ $("#app").innerHTML = `<div class="vazio"><div class="ico">${ic("cadeado")}</div>Abra a loja pelo botão do bot no Telegram.${INIT ? "" : `<div class="gap"></div><a class="btn" style="max-width:260px;margin:0 auto" href="/painel">${ic("coroa")} Sou a criadora: entrar</a>`}</div>`; return }
  const primeira = !D;
  D = r;
  aplicarTema(D.recursos?.tema);
  if(primeira && D.sou_criadora) return escolherModo();
  if(!PLANO_SEL) PLANO_SEL = D.assinatura?.plano || (D.planos.find(p => p.economia) || D.planos[0])?.id;
  render();
}

function irPara(nova){
  const ordem = [...document.querySelectorAll("#barra [data-aba]")].map(b => b.dataset.aba);
  const a = ordem.indexOf(ABA), b = ordem.indexOf(nova);
  DIR = a < 0 || b < 0 || a === b ? "" : b > a ? "vai-dir" : "vai-esq";
  SALTA = nova !== ABA; ANIMAR = nova !== ABA; ABA = nova; vibrar("leve"); render();
  window.scrollTo({top: ABA === "inicio" ? 0 : Math.min(window.scrollY, 120), behavior:"smooth"});
}

function enquete(p){
  const E = p.enquete; if(!E) return "";
  const total = E.votos.reduce((a, b) => a + b, 0), ver = E.meu != null || criadora() || PREVIA;
  return `<div class="enquete" data-enq="${p.id}">${E.opcoes.map((o, i) => {
    const pct = total ? Math.round(E.votos[i] * 100 / total) : 0;
    return ver ? `<div class="opc ${E.meu === i ? "meu" : ""}"><i style="width:${pct}%"></i><span>${E.meu === i ? `${ic("check")} ` : ""}${esc(o)}</span><b>${pct}%</b></div>`
               : `<button class="opc" data-votar="${p.id}:${i}"><span>${esc(o)}</span></button>`;
  }).join("")}<small class="muted">${ic("grafico")} ${pl(total, "voto", "votos")}${ver ? "" : " · toque numa opção para votar"}</small></div>`;
}
async function votar(ref){
  const [id, op] = ref.split(":").map(Number);
  const p = D.posts.find(x => x.id === id); if(!p) return;
  vibrar("leve");
  p.enquete.meu = op; p.enquete.votos[op]++;                    // resposta otimista
  const el = document.querySelector(`[data-enq="${id}"]`); if(el) el.outerHTML = enquete(p);
  const r = await api("/api/loja/votar", {post_id: id, opcao: op});
  if(r.ok){ p.enquete.meu = r.meu; p.enquete.votos = r.votos; const el2 = document.querySelector(`[data-enq="${id}"]`); if(el2) el2.outerHTML = enquete(p) }
}
// ── Início: busca, filtros e feed ─────────────────────────────────────────
let BUSCA = "", FILTROS_FEED = {midia: "todas", compra: "todos", ordem: "recentes"}, T_BUSCA = null;
const FEED_PADRAO = {midia: "todas", compra: "todos", ordem: "recentes"};
const semAcento = t => String(t || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const qtdFiltros = () => Object.keys(FEED_PADRAO).filter(k => FILTROS_FEED[k] !== FEED_PADRAO[k]).length;
function bateBusca(x){
  if(!BUSCA.trim()) return true;
  const alvo = semAcento([x.titulo, x.legenda, x.resumo, x.texto, ...(x.packs || []), ...((x.enquete || {}).opcoes || [])].join(" "));
  return semAcento(BUSCA).split(/\s+/).filter(Boolean).every(p => alvo.includes(p));
}
function itensFeed(){
  let itens = [...D.combos.map(x => ({...x, combo:true})), ...D.packs];
  if(criadora()) itens = itens.map(x => ({...x, comprado: true}));
  if(FILTRO === "packs") itens = itens.filter(x => !x.combo);
  if(FILTRO === "combos") itens = itens.filter(x => x.combo);
  if(FILTRO === "posts") itens = [];
  if(COLECAO) itens = itens.filter(x => x.colecao_id === COLECAO);
  if(FILTROS_FEED.midia === "video") itens = itens.filter(x => x.videos > 0 || /vídeo/.test(x.resumo || ""));
  if(FILTROS_FEED.midia === "fotos") itens = itens.filter(x => !(x.videos > 0) && !/vídeo/.test(x.resumo || ""));
  if(FILTROS_FEED.compra === "nao" && !criadora()) itens = itens.filter(x => !x.comprado);
  if(FILTROS_FEED.compra === "sim" && !criadora()) itens = itens.filter(x => x.comprado);
  // posts grátis só entram quando nenhum filtro de pack está ligado (eles não têm preço nem compra)
  const soPacks = FILTROS_FEED.midia !== "todas" || FILTROS_FEED.compra !== "todos" || ["menor", "maior"].includes(FILTROS_FEED.ordem);
  const posts = (FILTRO === "todos" || FILTRO === "posts") && !soPacks && !COLECAO ? D.posts.map(p => ({...p, texto_post:true})) : [];
  let todos = [...posts, ...itens].filter(bateBusca);
  const curt = x => ((D.curtidas || {})[x.texto_post ? `post_${x.id}` : x.id] || {}).n || 0;
  if(FILTROS_FEED.ordem === "menor") todos.sort((a, b) => a.preco - b.preco);
  else if(FILTROS_FEED.ordem === "maior") todos.sort((a, b) => b.preco - a.preco);
  else if(FILTROS_FEED.ordem === "curtidos") todos.sort((a, b) => curt(b) - curt(a) || String(b.criado_em || "").localeCompare(String(a.criado_em || "")));
  else todos.sort((a, b) => (b.combo ? 1 : 0) - (a.combo ? 1 : 0) || String(b.criado_em || "").localeCompare(String(a.criado_em || "")));
  return todos;
}

  return topo + extras + `<div class="feed">${meta}${bloqueio}${lanc.map(cardLancamento).join("")}${todos.map(x => x.texto_post ? postTexto(x) : cardPack(x)).join("")}</div>`;

function partesTempo(iso){
  const s = Math.max(0, Math.floor((new Date(iso) - Date.now()) / 1000));
  return {s, d: Math.floor(s / 86400), h: Math.floor(s % 86400 / 3600), m: Math.floor(s % 3600 / 60), seg: s % 60};
}
function relogio(iso){
  const t = partesTempo(iso), dd = n => String(n).padStart(2, "0");
  const blocos = t.d ? [[t.d, "dias"], [dd(t.h), "horas"], [dd(t.m), "min"]] : [[dd(t.h), "horas"], [dd(t.m), "min"], [dd(t.seg), "seg"]];
  return `<div class="relogio" data-cd="${esc(iso)}">${blocos.map(([v, r]) => `<div><b>${v}</b><small>${r}</small></div>`).join("")}</div>`;
}

// Fica salvo neste aparelho; o servidor confere tudo de novo na hora de pagar.
let CARRINHO = (() => { try{ return JSON.parse(localStorage.getItem("carrinho") || "[]").filter(x => typeof x === "string") }catch(e){ return [] } })();
function salvarCarrinho(){ try{ localStorage.setItem("carrinho", JSON.stringify(CARRINHO)) }catch(e){} }
function podarCarrinho(){        // tira o que saiu da vitrine ou já foi comprado
  if(!D) return;
  const ok = new Set(D.packs.filter(p => !p.comprado).map(p => p.id));
  const antes = CARRINHO.length; CARRINHO = CARRINHO.filter(id => ok.has(id));
  if(CARRINHO.length !== antes) salvarCarrinho();
}
const botaoCarrinho = id => { const on = CARRINHO.includes(id);
  return `<button class="btn-cart ${on ? "on" : ""}" data-cart="${id}" aria-label="${on ? "Tirar do carrinho" : "Adicionar ao carrinho"}">${on ? `${ic("check")}` : `${ic("carrinho")}`}</button>` };
function totaisCarrinho(){
  const itens = CARRINHO.map(id => D.packs.find(p => p.id === id)).filter(Boolean);
  const cheio = itens.reduce((a, p) => a + p.preco, 0), C = D.carrinho_cfg || {pct: 0, min: 3};
  const desconto = C.pct && itens.length >= C.min ? Math.floor(cheio * C.pct / 100) : 0;
  return {itens, cheio, desconto, total: Math.max(100, cheio - desconto), C};
}
function alternarCarrinho(id, el){
  const i = CARRINHO.indexOf(id);
  if(i >= 0) CARRINHO.splice(i, 1); else CARRINHO.push(id);
  salvarCarrinho(); vibrar(i >= 0 ? "leve" : "success");
  document.querySelectorAll(`[data-cart="${id}"]`).forEach(b => b.outerHTML = botaoCarrinho(id));
  if(i < 0){ const {itens, C} = totaisCarrinho(); const faltam = C.pct ? C.min - itens.length : 0;
    toast(faltam > 0 ? `No carrinho ${ic("carrinho")} · mais ${pl(faltam, "pack", "packs")} para ganhar ${C.pct}% OFF` : C.pct && itens.length >= C.min ? `No carrinho ${ic("carrinho")} · ${C.pct}% OFF aplicado` : `Adicionado ao carrinho ${ic("carrinho")}`) }
  barraCarrinho();
}
function barraCarrinho(){
  $("#carrinho-bar")?.remove();
  const mostrar = D && !criadora() && ABA === "inicio" && CARRINHO.length && !$("#galeria") && !$("#stories");
  document.body.classList.toggle("tem-carrinho", !!mostrar);
  if(!mostrar) return;
  const {itens, total, desconto} = totaisCarrinho();
  const b = document.createElement("div"); b.className = "carrinho-bar"; b.id = "carrinho-bar";
  b.innerHTML = `<span class="ico">${ic("carrinho")}</span><div><b>${pl(itens.length, "pack", "packs")} · ${reais(total)}</b><small>${desconto ? `você economiza ${reais(desconto)}` : "um PIX só para tudo"}</small></div><button class="btn mini" tabindex="-1">Ver carrinho</button>`;
  b.onclick = abrirCarrinho;
  document.body.appendChild(b);
}
function abrirCarrinho(){
  podarCarrinho();
  const {itens, cheio, desconto, total, C} = totaisCarrinho();
  if(!itens.length){ fecharFolha(); barraCarrinho(); return toast("Seu carrinho está vazio") }
  const faltam = C.pct ? C.min - itens.length : 0;
  abrirFolha(`<h2>Seu carrinho</h2><p class="sub">Pague tudo com um PIX só. Cada pack chega no chat com o bot.</p>

  // tocar à esquerda volta, à direita avança; segurar pausa; arrastar para baixo fecha
  ["sv-esq", "sv-dir"].forEach(id => {
    const z = $("#" + id);
    z.addEventListener("pointerdown", e => { SV.y0 = e.clientY; SV.segurando = setTimeout(() => { SV.segurando = "ok"; pausarStory(true) }, 200) });
    z.addEventListener("pointerup", e => {
      const segurou = SV.segurando === "ok"; clearTimeout(SV.segurando); SV.segurando = null;
      if(SV.y0 != null && e.clientY - SV.y0 > 90){ SV.y0 = null; return fecharStories() }

      vibrar("leve"); mostrarStory(SV.i + (id === "sv-esq" ? -1 : 1));
    });
